<script>
var LS = [];
LS.push({
em: ["👨", "❤️", "👦"], game: "hearts",
t: "Бог — мій люблячий Тато|God Is My Loving Dad",
ref: "Луки 15:11–32; 1 Івана 4:8|Luke 15:11–32; 1 John 4:8",
su: [
"Одного суботнього ранку Марко з татом пішли на великий ярмарок. Там було стільки цікавого! Пахло медовими пряниками, грала весела музика, а над головами гойдалися різнокольорові кульки. Марко тримав тата за руку й крутив головою на всі боки.",
"Раптом він побачив клоуна на високих ходулях. Клоун жонглював яблуками й смішно кланявся. Марко відпустив татову руку — лише на хвилинку! — і побіг подивитися ближче. А коли озирнувся, тата поруч не було. Довкола ходили самі незнайомі люди.",
"Маркові стало тривожно. «А що, як тато розсердиться? — подумав він. — Я ж сам відпустив руку». Він сів на лавку біля каруселі й тихенько заплакав.",
"А тато в цей час уже шукав сина. Він обійшов усі ятки, зазирнув до каруселі, розпитував продавців. Він не думав про те, хто винен. Він думав лише про одне: «Де мій хлопчик? Я мушу його знайти!»",
"І ось тато побачив знайому синю курточку. Він побіг — справді побіг, як хлопчисько! — підхопив Марка на руки й міцно-міцно обійняв. «Я знайшов тебе! Як же я радий!» — сказав тато. Він не сварився. Він сміявся, і очі його сяяли.",
"Увечері, коли вони пили чай із пряниками, Марко запитав: «Тату, а ти не сердився на мене?» Тато усміхнувся: «Я тебе люблю, синку. Коли любиш, найголовніше — бути разом». Потім він додав: «Знаєш, Ісус розповідав, що Бог — саме такий Тато. Він любить нас не за те, що ми слухняні чи найкращі. Він любить, бо ми Його діти».",
"Марко замислився. «Тобто Бог теж мене шукає, коли мені сумно чи страшно?» — «Так, — кивнув тато. — Біблія каже дуже просто: Бог є любов. Він завжди поруч, завжди радий тобі й ніколи не перестане тебе любити».",
"«А якщо я знову загублюся?» — запитав Марко. Тато підморгнув: «Тоді я знову тебе знайду. Хоч сто разів. Мені не набридне». Марко засміявся й притулився до татового плеча. Від тата пахло пряниками й домом.",
"Тієї ночі Марко заснув з усмішкою. Йому було тепло й спокійно, бо він знав: у нього є тато на землі й люблячий Тато на небі."],
se: [
"One Saturday morning Marko and his dad went to a big fair. There was so much to see! The air smelled of honey gingerbread, cheerful music was playing, and colourful balloons swayed above their heads. Marko held his dad’s hand and kept turning his head in every direction.",
"Suddenly he saw a clown on tall stilts. The clown was juggling apples and bowing in a funny way. Marko let go of his dad’s hand — only for a minute! — and ran to look closer. When he turned around, Dad was not there. Only strangers were walking by.",
"Marko felt worried. “What if Dad gets angry?” he thought. “I let go of his hand myself.” He sat down on a bench near the merry-go-round and quietly began to cry.",
"Meanwhile Dad was already looking for his son. He walked past every stall, checked the merry-go-round and asked the sellers. He was not thinking about whose fault it was. He had only one thought: “Where is my boy? I must find him!”",
"And then Dad saw a familiar blue jacket. He ran — really ran, like a little boy! — picked Marko up and hugged him very, very tight. “I found you! I am so glad!” said Dad. He did not scold. He was laughing, and his eyes were shining.",
"In the evening, when they were drinking tea with gingerbread, Marko asked, “Dad, weren’t you angry with me?” Dad smiled. “I love you, son. When you love someone, the most important thing is to be together.” Then he added, “You know, Jesus told us that God is exactly this kind of Dad. He does not love us because we are obedient or the best. He loves us because we are His children.”",
"Marko thought about it. “So God looks for me too, when I am sad or scared?” “Yes,” Dad nodded. “The Bible says it very simply: God is love. He is always near, always glad to see you, and He will never stop loving you.”",
"“What if I get lost again?” Marko asked. Dad winked. “Then I will find you again. Even a hundred times. I will never get tired of it.” Marko laughed and leaned against Dad’s shoulder. Dad smelled of gingerbread and home.",
"That night Marko fell asleep with a smile. He felt warm and calm, because he knew: he has a dad on earth and a loving Dad in heaven."],
v: "Своїми словами: «Бог є любов» (1 Івана 4:8). А Ісус розповів про батька, який побачив сина ще здалеку, побіг назустріч і обійняв його (Луки 15:20).|In simple words: “God is love” (1 John 4:8). And Jesus told about a father who saw his son from far away, ran to meet him and hugged him (Luke 15:20).",
idea: "Бог — добрий Небесний Тато. Він любить тебе завжди: коли в тебе все виходить і коли щось не вдається.|God is a kind Heavenly Dad. He loves you always: when everything works out and when something goes wrong.",

su: [
"Давним-давно люди часто питали одне одного: «А який Він — Бог?» Ніхто не міг Його побачити. Дехто думав, що Бог дуже далеко. Інші гадали, що Він суворий і до Нього страшно підійти. Люди просто не знали.",
"І тоді прийшов Ісус. Він ходив від міста до міста, від села до села, і всюди, де Він з’являвся, ставало світліше — ніби сонце виходило з-за хмар.",
"Одного дня мами привели до Ісуса своїх дітей. Малеча галасувала, сміялася й штовхалася. Учні Ісуса насупилися: «Не заважайте! Учитель утомився». Та Ісус сказав: «Пустіть дітей до Мене й не забороняйте їм!» Він брав малюків на руки, обіймав і благословляв кожного.",
"Ісус торкався хворих — і вони одужували. Він сідав за стіл із тими, з ким ніхто не хотів дружити. Він нагодував цілий натовп голодних людей п’ятьма хлібинами й двома рибками. Він ніколи нікого не проганяв.",
"Якось учень на ім’я Пилип попросив: «Господи, покажи нам Отця — і нам цього досить!» Ісус подивився на нього лагідно й відповів: «Пилипе, хто бачив Мене, той бачив Отця».",
"Ось яка чудова таємниця! Хочеш знати, який Бог? Подивися на Ісуса. Ісус обіймав дітей — отже, Отець радіє дітям. Ісус був добрим до всіх — отже, Отець добрий. Ісус нікого не лякав — отже, й Отця не треба боятися.",
"А ще Ісус сказав слова, які знають у всьому світі: Бог так полюбив світ, що віддав Свого Сина, щоб кожен, хто вірить у Нього, мав вічне життя.",
"А одного разу Ісус розповів людям, як молитися. Він не сказав: «Звертайтеся до Бога дуже урочисто й здалеку». Він сказав просто: «Кажіть: Отче наш». Тобто — наш Тату. Так може сказати кожен: і дорослий, і зовсім маленький. Бо Бог — не чужий і далекий Володар. Він — рідний Отець, який завжди радий почути твій голос. Можеш спробувати вже сьогодні.",
"Тому, коли ти читаєш історії про Ісуса, пам’ятай: це не просто давні оповідки. Це портрет Отця, намальований любов’ю. І на цьому портреті Бог усміхається до тебе."],
se: [
"Long, long ago people often asked one another, “What is God like?” Nobody could see Him. Some thought God was very far away. Others imagined He was strict and scary to come close to. People simply did not know.",
"And then Jesus came. He walked from town to town, from village to village, and wherever He appeared it became brighter — as if the sun had come out from behind the clouds.",
"One day mothers brought their children to Jesus. The little ones were noisy, laughing and pushing. Jesus’ disciples frowned: “Do not disturb Him! The Teacher is tired.” But Jesus said, “Let the children come to Me, and do not stop them!” He took the little ones in His arms, hugged them and blessed each one.",
"Jesus touched sick people — and they got well. He sat at the table with those nobody wanted to be friends with. He fed a whole crowd of hungry people with five loaves and two small fish. He never sent anyone away.",
"Once a disciple named Philip asked, “Lord, show us the Father, and that will be enough for us!” Jesus looked at him gently and answered, “Philip, whoever has seen Me has seen the Father.”",
"What a wonderful secret! Do you want to know what God is like? Look at Jesus. Jesus hugged children — so the Father is glad about children. Jesus was kind to everyone — so the Father is kind. Jesus did not frighten anyone — so there is no need to be afraid of the Father.",
"Jesus also said words that are known all over the world: God loved the world so much that He gave His Son, so that everyone who believes in Him may have eternal life.",
"And once Jesus told people how to pray. He did not say, “Speak to God very solemnly and from far away.” He simply said, “Say: Our Father.” That means — our Dad. Anyone can say it: a grown-up and a very little child. Because God is not a distant stranger. He is a dear Father who is always glad to hear your voice. You can try it today.",
"So when you read the stories about Jesus, remember: they are not just old tales. They are a portrait of the Father, painted with love. And in this portrait God is smiling at you."],

idea: "Щоб дізнатися, який Бог, подивися на Ісуса: Він добрий, уважний і радий кожній дитині.|To find out what God is like, look at Jesus: He is kind, attentive and glad to see every child.",
ex: ["Коли читаєш, як Ісус обіймав дітей, уяви, що Він так само радий тобі.|When you read how Jesus hugged the children, imagine He is just as glad to see you.",

"Коли ділишся з другом, ти теж показуєш, який добрий наш Отець.|When you share with a friend, you also show how kind our Father is."],
end: "Дивлячись на Ісуса, ти бачиш усмішку Отця!|Looking at Jesus, you see the Father’s smile!",
q: [

{k: "fill", q: "«Хто бачив Мене, той бачив ___».|“Whoever has seen Me has seen the ___.”", o: ["царя|king", "Отця|Father", "ангела|angel"], a: 1, h: "Пилип просив показати саме Його.|This is exactly whom Philip asked to see.", e: "Ісус показує нам, який Отець.|Jesus shows us what the Father is like."},

{k: "mc", q: "Як дізнатися, який Бог?|How can we find out what God is like?", o: ["Боятися й ховатися|Be afraid and hide", "Подивитися на Ісуса|Look at Jesus", "Ніяк не можна|There is no way"], a: 1, h: "Хто став для нас портретом Отця?|Who became the Father’s portrait for us?", e: "Ісус — найкращий портрет Отця.|Jesus is the best portrait of the Father."}]

t: "Благодать — чудовий подарунок|Grace Is a Wonderful Gift",

su: [
"Олі виповнилося вісім років. Зранку у двері подзвонили — на порозі стояла бабуся Віра з великою коробкою, перев’язаною жовтою стрічкою. «З днем народження, моя ластівко!»",
"Оля розв’язала стрічку й ахнула. У коробці лежав справжній набір художниці: тридцять шість фарб, пензлики, альбом і маленький мольберт. Саме про такий вона мріяла цілий рік!",
"Та раптом Оля спохмурніла. «Це ж, мабуть, дуже дорого», — подумала вона. Дівчинка побігла до кімнати, взяла свою скарбничку-совеня й висипала на стіл усі монетки. «Бабусю, ось. Я заплачу тобі за подарунок».",
"Бабуся лагідно засміялася й накрила монетки долонею. «Сонечко, подарунок не купують. Якщо ти заплатиш, це буде вже покупка. А я дарую, бо люблю тебе».",
"«Але ж я не завжди була чемна, — тихо сказала Оля. — Я розбила твою чашку. І сперечалася з тобою». — «Подарунок — це не медаль за поведінку, — відповіла бабуся. — Він не від твоїх заслуг. Він від моєї любові».",
"«А що ж мені тоді робити?» — «Просто прийми. Скажи «дякую» і малюй собі на радість!»",
"Оля малювала цілий день. А ввечері принесла бабусі картину: бабуся в саду серед соняшників. «Це плата?» — підморгнула бабуся. «Ні! — засміялася Оля. — Це подяка. Мені просто дуже захотілося тебе потішити».",
"Тоді бабуся обійняла внучку й сказала: «Знаєш, Божа любов — така сама. У Біблії вона має гарне ім’я — благодать. Там написано: ви спасенні благодаттю, і це не від вас — це Божий дар. Його не можна заробити добрими справами, тож ніхто не може хвалитися».",
"Оля подивилася на свій мольберт. «Тобто Бог любить мене так само, як ти, бабусю? Просто так?» — «Ще більше, ластівко. І Його любов не закінчується ні в день народження, ні в жоден інший день. Вона — щоранку нова». Оля аж підстрибнула від радості.",
"«А добрі справи тоді навіщо?» — запитала Оля. «А навіщо ти намалювала мені картину? — усміхнулася бабуся. — Не щоб заслужити любов. А тому, що тебе вже люблять. Бог створив нас для добрих справ, і вони виростають із радості — як квіти із землі після теплого дощу»."],
se: [
"Olia turned eight. In the morning the doorbell rang — Grandma Vira was standing at the door with a big box tied with a yellow ribbon. “Happy birthday, my little swallow!”",
"Olia untied the ribbon and gasped. Inside the box was a real artist’s set: thirty-six paints, brushes, a sketchbook and a small easel. It was exactly what she had been dreaming of for a whole year!",
"But suddenly Olia frowned. “This must be very expensive,” she thought. The girl ran to her room, took her little owl piggy bank and poured all the coins onto the table. “Grandma, here. I will pay you for the present.”",
"Grandma laughed gently and covered the coins with her hand. “Sweetheart, a gift is not bought. If you pay, it becomes a purchase. I am giving it because I love you.”",
"“But I was not always good,” Olia said quietly. “I broke your cup. And I argued with you.” “A gift is not a medal for behaviour,” Grandma answered. “It does not come from what you deserve. It comes from my love.”",
"“Then what should I do?” “Just accept it. Say ‘thank you’ and paint for joy!”",
"Olia painted all day long. In the evening she brought Grandma a picture: Grandma in the garden among sunflowers. “Is this a payment?” Grandma winked. “No!” Olia laughed. “It is a thank-you. I just really wanted to make you happy.”",
"Then Grandma hugged her granddaughter and said, “You know, God’s love is just the same. In the Bible it has a beautiful name — grace. It says: you are saved by grace, and this is not from yourselves — it is the gift of God. It cannot be earned by good deeds, so nobody can boast.”",
"Olia looked at her easel. “So God loves me the way you do, Grandma? Just because?” “Even more, my little swallow. And His love does not end on a birthday or on any other day. It is new every morning.” Olia jumped for joy.",
"“Then what are good deeds for?” Olia asked. “Why did you paint me a picture?” Grandma smiled. “Not to earn love. But because you are already loved. God made us for good deeds, and they grow out of joy — like flowers from the ground after warm rain.”"],
v: "Своїми словами: ми спасенні благодаттю через віру, і це не від нас — це Божий дар, не за справи, щоб ніхто не хвалився. Бог створив нас для добрих справ (Ефесян 2:8–10).|In simple words: we are saved by grace through faith, and this is not from ourselves — it is God’s gift, not for our deeds, so that no one can boast. God made us for good deeds (Ephesians 2:8–10).",
idea: "Благодать — це подарунок Божої любові. Його не купують і не заробляють — його приймають із радістю.|Grace is the gift of God’s love. It is not bought or earned — it is received with joy.",
ex: ["Сонце світить усім зранку — його не треба заслуговувати. Так і Божа любов.|The sun shines for everyone in the morning — you do not have to deserve it. God’s love is like that.",
"Коли тебе пригощають просто так, скажи «дякую» й радій — не треба «відробляти».|When someone treats you just because, say “thank you” and enjoy — no need to “pay it back”.",
"Коли допомагаєш мамі, роби це з радості, а не щоб тебе більше любили: тебе вже люблять.|When you help Mum, do it out of joy, not to be loved more: you are already loved."],
end: "Божу любов не треба заробляти. Вона вже твоя!|You do not have to earn God’s love. It is already yours!",
q: [
{k: "mc", q: "Що Оля хотіла зробити з монетками?|What did Olia want to do with her coins?", o: ["Купити морозиво|Buy ice cream", "Заплатити за подарунок|Pay for the present", "Сховати їх|Hide them"], a: 1, h: "Вона висипала їх на стіл перед бабусею.|She poured them onto the table in front of Grandma.", e: "Оля хотіла заплатити, але подарунок не купують.|Olia wanted to pay, but a gift is not bought."},
{k: "tf", q: "Благодать можна купити добрими справами.|Grace can be bought with good deeds.", a: 0, h: "Що бабуся сказала про подарунок і покупку?|What did Grandma say about a gift and a purchase?", e: "Благодать — це дар. Її приймають, а не купують.|Grace is a gift. It is received, not bought."},
{k: "fill", q: "Благодать — це Божий ___.|Grace is God’s ___.", o: ["іспит|exam", "борг|debt", "подарунок|gift"], a: 2, h: "Його перев’язують стрічкою й дарують із любов’ю.|It is tied with a ribbon and given with love.", e: "Так! «Це Божий дар» (Ефесян 2:8).|Yes! “It is the gift of God” (Ephesians 2:8)."},
{k: "pair", q: "З’єднай слово з поясненням.|Match the word with its meaning.", p: [["Подарунок|Gift", "приймають із радістю|is received with joy"], ["Покупка|Purchase", "оплачують грошима|is paid for with money"], ["Подяка|Thank-you", "виростає з радості|grows out of joy"]], h: "За що платять, а що дарують просто так?|What do we pay for, and what is given freely?", e: "Молодець! Благодать — це подарунок, а не покупка.|Well done! Grace is a gift, not a purchase."},
{k: "mc", q: "Чому ми робимо добрі справи?|Why do we do good deeds?", o: ["Бо нас уже люблять|Because we are already loved", "Щоб заробити Божу любов|To earn God’s love", "Щоб нас хвалили|To be praised"], a: 0, h: "Згадай, чому Оля намалювала картину.|Remember why Olia painted the picture.", e: "Добрі справи виростають із радості, що нас люблять.|Good deeds grow out of the joy of being loved."}]

ref: "Луки 15:11–32|Luke 15:11–32",
su: [
"Цю історію розповів сам Ісус. Жив собі батько, і мав він двох синів, великий дім і широкі поля. Одного дня молодший син сказав: «Тату, дай мені мою частку майна. Я хочу жити сам». Батькові стало сумно, але він дав. Бо любов нікого не тримає силою.",
"Син зібрав речі й вирушив у далекий край. Там він жив весело: бенкети, нове вбрання, багато «друзів». Та гроші розтанули швидко, як сніг навесні. А разом із грошима зникли й «друзі».",
"У тому краї настав голод. Юнак найнявся пасти свиней. Він був такий голодний, що ладен був їсти свинячий корм, та й того йому ніхто не давав.",
"Тоді він згадав дім. «У мого батька навіть наймити мають удосталь хліба! Піду до нього й скажу: «Тату, я вчинив погано. Я вже не вартий зватися твоїм сином. Візьми мене хоч наймитом». Усю дорогу він повторював ці слова, щоб не забути.",
"А батько щодня виходив на дорогу й дивився вдалину. І ось одного дня він побачив далеко-далеко знайому постать. Серце батька сповнилося ніжністю. Він побіг назустріч — поважний господар біг, як хлопчик! — кинувся синові на шию й поцілував його.",
"Син почав свою промову: «Тату, я вже не вартий…» Та батько навіть не дав йому договорити. «Швидше! — гукнув він слугам. — Принесіть найкращий одяг, перстень на руку, сандалі на ноги! Готуйте бенкет! Мій син загубився — і знайшовся!»",
"І почалося свято з музикою й танцями. Старший брат повертався з поля, почув музику й образився: «Я стільки років працюю, а свято — для нього?» Батько вийшов і до нього: «Сину, ти завжди зі мною, і все моє — твоє. Ходімо радіти разом: твій брат повернувся!»",
"Того вечора в домі було світло й гамірно. Син сидів поруч із батьком у новому вбранні й ніяк не міг повірити: його не просто пустили на поріг — йому раділи, як найдорожчому гостеві.",
"Ісус розповів цю історію, щоб ми знали, який наш Небесний Отець. Двері Його дому завжди відчинені. Він не чекає від нас виправдань і завчених промов. Він чекає на нас самих — і біжить назустріч першим."],
se: [
"Jesus Himself told this story. There was a father who had two sons, a big house and wide fields. One day the younger son said, “Dad, give me my share of everything. I want to live on my own.” The father felt sad, but he gave it. Because love does not hold anyone by force.",
"The son packed his things and set off for a faraway land. He lived merrily there: feasts, new clothes, many “friends”. But the money melted quickly, like snow in spring. And together with the money the “friends” disappeared too.",
"A famine came to that land. The young man took a job feeding pigs. He was so hungry that he was ready to eat the pigs’ food, but nobody gave him even that.",
"Then he remembered home. “Even my father’s workers have plenty of bread! I will go to him and say, ‘Dad, I did wrong. I am no longer worthy to be called your son. Take me as a hired worker.’” All the way he kept repeating these words so he would not forget them.",
"And the father went out to the road every day and looked into the distance. One day he saw a familiar figure far, far away. The father’s heart filled with tenderness. He ran to meet him — a respected master running like a boy! — threw his arms around his son and kissed him.",
"The son began his speech: “Dad, I am no longer worthy…” But the father did not even let him finish. “Quick!” he called to the servants. “Bring the best robe, a ring for his hand, sandals for his feet! Prepare a feast! My son was lost — and is found!”",
"And a celebration began, with music and dancing. The older brother was coming back from the field, heard the music and felt hurt: “I have worked for so many years, and the party is for him?” The father went out to him as well: “Son, you are always with me, and everything I have is yours. Come, let us rejoice together: your brother has come back!”",
"That evening the house was bright and noisy. The son sat next to his father in his new robe and could hardly believe it: he had not just been let in at the door — he was welcomed like the dearest guest.",
"Jesus told this story so that we would know what our Heavenly Father is like. The door of His house is always open. He does not wait for excuses and rehearsed speeches. He waits for us — and He is the first to run to meet us."],
v: "Своїми словами: «Коли син був ще далеко, батько побачив його, змилосердився, побіг, обійняв і поцілував його» (Луки 15:20).|In simple words: “While the son was still far away, his father saw him, was filled with compassion, ran, hugged him and kissed him” (Luke 15:20).",
idea: "До Отця завжди можна повернутися. Він не згадує образ — Він радіє і влаштовує свято.|You can always come back to the Father. He does not bring up the past — He rejoices and prepares a feast.",
ex: ["Якщо ти зробив щось не так, не ховайся: підійди до мами чи тата й розкажи. Тебе люблять.|If you did something wrong, do not hide: go to Mum or Dad and tell them. You are loved.",
"Коли друг просить пробачення, зустрінь його, як той батько: з відкритим серцем.|When a friend says sorry, meet them like that father did: with an open heart.",
"Коли хтось отримав більше уваги, згадай слова батька: «Все моє — твоє». Любові вистачить усім.|When someone gets more attention, remember the father’s words: “Everything I have is yours.” There is enough love for everyone."],
end: "Двері Отцівського дому завжди відчинені для тебе!|The door of the Father’s house is always open for you!",
q: [
{k: "order", q: "Розстав події притчі в правильному порядку.|Put the events of the parable in the right order.", s: ["Син попросив свою частку|The son asked for his share", "Він пішов у далекий край|He went to a faraway land", "Голодний, він пас свиней|Hungry, he fed pigs", "Батько побіг йому назустріч|The father ran to meet him"], h: "Історія починається вдома й закінчується вдома.|The story begins at home and ends at home.", e: "Так! А наприкінці було велике свято.|Yes! And at the end there was a great feast."},
{k: "mc", q: "Що зробив батько, коли побачив сина здалеку?|What did the father do when he saw his son far away?", o: ["Зачинив двері|Closed the door", "Чекав на вибачення|Waited for an apology", "Побіг, обійняв і поцілував|Ran, hugged and kissed him"], a: 2, h: "Він зробив це, як хлопчик, — дуже швидко!|He did it like a boy — very quickly!", e: "Батько побіг першим. Такий наш Небесний Отець.|The father ran first. That is what our Heavenly Father is like."},
{k: "tf", q: "Батько спершу змусив сина попрацювати наймитом.|The father first made his son work as a hired worker.", a: 0, h: "Чи дав батько синові договорити промову?|Did the father let his son finish his speech?", e: "Ні! Батько одразу дав найкращий одяг, перстень і влаштував свято.|No! The father gave the best robe and a ring at once and prepared a feast."},
{k: "fill", q: "«Мій син загубився — і ___!»|“My son was lost — and is ___!”", o: ["знайшовся|found", "запізнився|late", "покараний|punished"], a: 0, h: "Протилежне до «загубився».|The opposite of “lost”.", e: "Загубився — і знайшовся! Яка радість!|Lost — and found! What joy!"},
{k: "mc", q: "Що батько сказав старшому синові?|What did the father say to the older son?", o: ["«Іди працюй далі»|“Go back to work”", "«Усе моє — твоє»|“Everything I have is yours”", "«Ти тут зайвий»|“You are not needed here”"], a: 1, h: "Батько любить обох синів однаково.|The father loves both sons the same.", e: "«Ти завжди зі мною, і все моє — твоє». Любові вистачає всім.|“You are always with me, and everything I have is yours.” There is enough love for all."}]
});

LS.push({

t: "Любов сильніша за страх|Love Is Stronger Than Fear",
ref: "1 Івана 4:18|1 John 4:18",
su: [
"Уночі над містом розгулялася гроза. Блискавка освітлювала кімнату білим світлом, а грім гуркотів так, що аж шибки дзвеніли. Тимко натягнув ковдру до самого носа. Тіні на стіні здавалися йому кудлатими велетнями.",
"«Мамо!» — тихенько покликав він. Мама прийшла одразу. Вона не сказала: «Як не соромно, ти ж уже великий». Вона сіла поруч, обійняла Тимка й прошепотіла: «Я тут. Я з тобою».",
"Грім іще гуркотів, але сталося диво: страх почав зменшуватися. Він танув, як сніжка в теплій долоні. «Мамо, а чому, коли ти поруч, мені не так страшно?» — запитав Тимко.",
"«Бо любов сильніша за страх, — відповіла мама. — Страх каже: «Ти сам». А любов каже: «Я з тобою». І коли любов поруч, страхові доводиться відступати».",
"Тимко трохи помовчав. «А в школі один хлопчик казав, що Бог за всіма стежить і карає за кожну помилку. Я злякався». Мама погладила його по голові. «Згадай Ісуса. Хіба Він лякав дітей? Він їх обіймав. У Біблії написано: в любові немає страху, досконала любов проганяє страх. Бог — не той, кого треба боятися. Він — Той, до кого біжать, коли страшно».",
"Потім вони разом рахували секунди між блискавкою й громом: «Один, два, три, чотири…» З кожним разом виходило більше. «Бачиш, гроза йде геть», — сказала мама. А ще вона показала, як дихати, коли тривожно: повільно вдихнути, ніби нюхаєш квітку, і повільно видихнути, ніби задуваєш свічку.",
"«Боятися іноді — це нормально, — додала мама. — Усі люди часом бояться, навіть дорослі. Просто не залишайся зі страхом сам на сам. Розкажи мені, татові чи бабусі. І Богові теж можна сказати: «Мені страшно, будь поруч».",
"Тимко позіхнув. Грім уже бурчав десь далеко-далеко, ніби старий кіт за стіною. «Мамо, посидь ще трішки», — попросив він. «Звичайно, посиджу», — сказала мама й заспівала тиху колискову. За хвилину Тимко вже спав.",
"Вранці світило сонце, а над дахами стояла веселка. Тимко взяв фломастери й намалював маленьку сіру хмаринку, а над нею — величезне червоне серце. «Це гроза, а це любов, — пояснив він мамі. — Любов більша»."],
se: [
"At night a thunderstorm broke out over the town. Lightning lit the room with white light, and the thunder rumbled so loudly that the windows rattled. Tymko pulled the blanket right up to his nose. The shadows on the wall looked like shaggy giants to him.",
"“Mum!” he called quietly. Mum came at once. She did not say, “Shame on you, you are a big boy.” She sat beside him, hugged Tymko and whispered, “I am here. I am with you.”",
"The thunder still rumbled, but something wonderful happened: the fear began to shrink. It melted like a snowball in a warm hand. “Mum, why is it not so scary when you are near?” Tymko asked.",
"“Because love is stronger than fear,” Mum answered. “Fear says, ‘You are alone.’ Love says, ‘I am with you.’ And when love is near, fear has to step back.”",
"Tymko was silent for a while. “At school a boy said that God watches everyone and punishes every mistake. I got scared.” Mum stroked his hair. “Think of Jesus. Did He frighten children? He hugged them. The Bible says: there is no fear in love; perfect love drives out fear. God is not someone to be afraid of. He is the One you run to when you are scared.”",
"Then they counted the seconds between the lightning and the thunder together: “One, two, three, four…” Each time there were more. “See, the storm is going away,” said Mum. She also showed him how to breathe when he feels worried: breathe in slowly, as if smelling a flower, and breathe out slowly, as if blowing out a candle.",
"“Being afraid sometimes is normal,” Mum added. “Everyone is afraid at times, even grown-ups. Just do not stay alone with your fear. Tell me, Dad or Grandma. And you can tell God too: ‘I am scared, be near me.’”",
"Tymko yawned. The thunder was now grumbling somewhere far, far away, like an old cat behind the wall. “Mum, stay a little longer,” he asked. “Of course I will,” said Mum, and she sang a quiet lullaby. A minute later Tymko was asleep.",
"In the morning the sun was shining, and a rainbow stood over the roofs. Tymko took his markers and drew a small grey cloud, and above it — a huge red heart. “This is the storm, and this is love,” he explained to Mum. “Love is bigger.”"],
v: "Своїми словами: «У любові немає страху, але досконала любов проганяє страх» (1 Івана 4:18).|In simple words: “There is no fear in love, but perfect love drives out fear” (1 John 4:18).",
idea: "Бога не треба боятися. Його любов поруч, і поруч із нею страх стає маленьким.|There is no need to be afraid of God. His love is near, and next to it fear becomes small.",
ex: ["Коли страшно в темряві, поклич когось із рідних і скажи Богові: «Будь поруч».|When you are scared in the dark, call someone from your family and tell God, “Be near me.”",
"Перед контрольною зроби «квітку й свічку»: повільний вдих і повільний видих.|Before a test do the “flower and candle”: a slow breath in and a slow breath out.",
"Якщо хтось лякає тебе Богом, згадай: Ісус обіймав дітей, а не лякав.|If someone tries to scare you with God, remember: Jesus hugged children, He did not frighten them."],
end: "Любов завжди більша за будь-яку хмаринку!|Love is always bigger than any cloud!",
q: [
{k: "mc", q: "Що зробила мама, коли Тимко покликав її?|What did Mum do when Tymko called her?", o: ["Прийшла й обійняла|Came and hugged him", "Сказала, що він уже великий|Said he was a big boy", "Не почула|Did not hear"], a: 0, h: "Вона прошепотіла: «Я з тобою».|She whispered, “I am with you.”", e: "Мама прийшла одразу. Любов завжди поспішає на допомогу.|Mum came at once. Love always hurries to help."},
{k: "tf", q: "Коли страшно, добре розповісти про це дорослому, якому довіряєш.|When you are scared, it is good to tell a grown-up you trust.", a: 1, h: "Що мама порадила Тимкові?|What did Mum advise Tymko?", e: "Так! Не залишайся зі страхом сам на сам.|Yes! Do not stay alone with your fear."},
{k: "fill", q: "Досконала любов проганяє ___.|Perfect love drives out ___.", o: ["радість|joy", "страх|fear", "друзів|friends"], a: 1, h: "Те, що танув, як сніжка в теплій долоні.|The thing that melted like a snowball in a warm hand.", e: "«Досконала любов проганяє страх» (1 Івана 4:18).|“Perfect love drives out fear” (1 John 4:18)."},
{k: "pair", q: "Хто що каже? З’єднай.|Who says what? Match.", p: [["Страх каже|Fear says", "«Ти сам»|“You are alone”"], ["Любов каже|Love says", "«Я з тобою»|“I am with you”"], ["Довіра каже|Trust says", "«Я можу попросити про допомогу»|“I can ask for help”"]], h: "Згадай мамині слова про страх і любов.|Remember Mum’s words about fear and love.", e: "Саме так! Любов завжди каже: «Я з тобою».|Exactly! Love always says, “I am with you.”"},
{k: "mc", q: "Хто для нас Бог, коли нам страшно?|Who is God for us when we are scared?", o: ["Той, хто стежить і карає|The one who watches and punishes", "Той, кому байдуже|The one who does not care", "Той, до кого можна бігти|The One we can run to"], a: 2, h: "Як Ісус ставився до дітей?|How did Jesus treat children?", e: "Бог — Той, до кого біжать, коли страшно.|God is the One we run to when we are scared."}]

LS.push({
em: ["🌅", "🌱", "🕊️"], game: "journey",
t: "Вічне життя у Христі|Eternal Life in Christ",
ref: "Івана 11:25–26; Івана 17:3|John 11:25–26; John 17:3",
su: [
"У селі Віфанія жили дві сестри — Марта й Марія — та їхній брат Лазар. Вони були добрими друзями Ісуса. Він любив приходити до них у гості, сидіти за столом і розмовляти.",
"Та одного разу Лазар тяжко захворів. Сестри послали до Ісуса звістку. Коли ж Ісус прийшов до Віфанії, Лазар уже помер. Усі в домі плакали, і серця сестер були повні смутку.",
"Марта вибігла Ісусові назустріч зі сльозами на очах. Ісус не сказав їй: «Не плач». Він побачив, як сумують Його друзі, — і заплакав разом із ними. У Біблії так і написано: «Ісус заплакав». Він поруч із нами, коли нам сумно.",
"А потім Ісус сказав Марті дивовижні слова: «Я — воскресіння і життя. Хто вірить у Мене, той житиме». Марта відповіла: «Так, Господи, я вірю».",
"Вони пішли до печери, де поховали Лазаря. Ісус подякував Отцеві й голосно покликав: «Лазарю, вийди!» І Лазар вийшов — живий! Сльози смутку стали сльозами радості. Сестри обіймали брата, а люди довкола не могли повірити своїм очам.",
"Так Ісус показав: життя сильніше за смерть, а любов Отця ніколи не закінчується.",
"А що таке вічне життя? Одного разу Ісус пояснив це в молитві: вічне життя — це знати Отця й Ісуса Христа. Тобто це не просто «дуже-дуже довго». Це дружба з Богом — справжня, тепла й жива.",
"Уяви маленьке джерельце в лісі. Воно дзюрчить уже сьогодні, а далі стає струмком, річкою і тече аж до моря. Так і вічне життя: воно починається не колись потім, а вже зараз — щоразу, коли ти розмовляєш з Богом, радієш сонцю, любиш і довіряєш.",
"Марта, Марія й Лазар знову сиділи з Ісусом за одним столом, сміялися й розмовляли. Вони зрозуміли найголовніше: поруч з Ісусом не треба боятися ні сьогоднішнього дня, ні завтрашнього. Бо Той, хто дарує життя, — їхній Друг. І твій Друг також. Він знає твоє ім’я і радий кожній розмові з тобою.",
"Тож вічне життя — це подарунок, який можна відкривати щодня. І ця дружба з Богом не закінчиться ніколи."],
se: [
"In the village of Bethany lived two sisters, Martha and Mary, and their brother Lazarus. They were good friends of Jesus. He loved to visit them, sit at their table and talk.",
"But one day Lazarus became very ill. The sisters sent word to Jesus. When Jesus came to Bethany, Lazarus had already died. Everyone in the house was crying, and the sisters’ hearts were full of sorrow.",
"Martha ran out to meet Jesus with tears in her eyes. Jesus did not tell her, “Do not cry.” He saw how sad His friends were — and He cried together with them. The Bible says just that: “Jesus wept.” He is close to us when we are sad.",
"Then Jesus said amazing words to Martha: “I am the resurrection and the life. Whoever believes in Me will live.” Martha answered, “Yes, Lord, I believe.”",
"They went to the cave where Lazarus had been buried. Jesus thanked the Father and called out loudly, “Lazarus, come out!” And Lazarus came out — alive! Tears of sorrow became tears of joy. The sisters hugged their brother, and the people around could not believe their eyes.",
"This is how Jesus showed that life is stronger than death, and the Father’s love never ends.",
"And what is eternal life? Once Jesus explained it in a prayer: eternal life is knowing the Father and Jesus Christ. So it is not just “a very, very long time”. It is friendship with God — real, warm and alive.",
"Imagine a tiny spring in the forest. It is already bubbling today, and later it becomes a stream, then a river, and flows all the way to the sea. Eternal life is like that: it does not begin some day later, it begins now — every time you talk with God, enjoy the sunshine, love and trust.",
"Martha, Mary and Lazarus sat at one table with Jesus again, laughing and talking. They understood the most important thing: next to Jesus there is no need to be afraid of today or of tomorrow. Because the One who gives life is their Friend. And your Friend too. He knows your name and is glad of every talk with you.",
"So eternal life is a gift you can open every day. And this friendship with God will never end."],
v: "Своїми словами: Ісус сказав: «Я — воскресіння і життя. Хто вірить у Мене, той житиме» (Івана 11:25). «Вічне життя — це знати Тебе, єдиного правдивого Бога, та Ісуса Христа» (Івана 17:3).|In simple words: Jesus said, “I am the resurrection and the life. Whoever believes in Me will live” (John 11:25). “Eternal life is to know You, the only true God, and Jesus Christ” (John 17:3).",
idea: "Вічне життя — це дружба з Богом, яка починається вже сьогодні й ніколи не закінчується.|Eternal life is friendship with God that begins today and never ends.",
ex: ["Коли вранці кажеш: «Доброго ранку, Отче!» — ти вже живеш цією дружбою.|When you say in the morning, “Good morning, Father!” you are already living this friendship.",
"Коли сумуєш за кимось, згадай: Ісус плакав разом із друзями й Він поруч.|When you miss someone, remember: Jesus cried with His friends, and He is near.",
"Коли садиш насінину й бачиш паросток, подумай: Бог любить дарувати життя.|When you plant a seed and see a sprout, think: God loves to give life."],
end: "Дружба з Богом — назавжди. І вона вже почалася!|Friendship with God is forever. And it has already begun!",
q: [
{k: "mc", q: "Що Ісус сказав Марті?|What did Jesus say to Martha?", o: ["«Не плач і йди додому»|“Do not cry and go home”", "«Я — воскресіння і життя»|“I am the resurrection and the life”", "«Я запізнився»|“I am too late”"], a: 1, h: "У цих словах є слово «життя».|These words contain the word “life”.", e: "«Я — воскресіння і життя» (Івана 11:25).|“I am the resurrection and the life” (John 11:25)."},
{k: "tf", q: "Ісус заплакав разом зі своїми друзями.|Jesus wept together with His friends.", a: 1, h: "У Біблії є дуже короткий вірш про це.|There is a very short Bible verse about it.", e: "Так. Ісус поруч, коли нам сумно.|Yes. Jesus is close when we are sad."},
{k: "fill", q: "Вічне життя — це знати ___.|Eternal life is knowing ___.", o: ["Отця та Ісуса|the Father and Jesus", "багато правил|many rules", "усі відповіді|all the answers"], a: 0, h: "Це про дружбу, а не про правила.|It is about friendship, not rules.", e: "Вічне життя — це знати Отця й Ісуса (Івана 17:3).|Eternal life is knowing the Father and Jesus (John 17:3)."},
{k: "order", q: "Розстав події історії про Лазаря.|Put the events of the Lazarus story in order.", s: ["Лазар захворів|Lazarus became ill", "Ісус прийшов до Віфанії|Jesus came to Bethany", "Ісус плакав разом із сестрами|Jesus wept with the sisters", "Лазар вийшов живий|Lazarus came out alive"], h: "Радість була в самому кінці.|The joy came at the very end.", e: "Так! Смуток перетворився на радість.|Yes! Sorrow turned into joy."},
{k: "mc", q: "Коли починається вічне життя?|When does eternal life begin?", o: ["Ніколи|Never", "Тільки колись дуже нескоро|Only some day far away", "Уже зараз, у дружбі з Богом|Right now, in friendship with God"], a: 2, h: "Згадай джерельце, що дзюрчить уже сьогодні.|Remember the spring that is already bubbling today.", e: "Вічне життя починається вже зараз!|Eternal life begins right now!"}]
});
LS.push({
em: ["🌹", "🌼", "🌻"], game: "garden",
t: "Я цінний і любимий|I Am Precious and Loved",
ref: "Псалом 139:14; Луки 12:6–7|Psalm 139:14; Luke 12:6–7",
su: [
"На гуртку малювання всі малювали улюблених тварин. Даринка намалювала кота. Потім глянула на аркуш сусідки Ілони — там скакав кінь, зовсім як справжній! Даринка подивилася на свого кота: вуха криві, хвіст як ковбаска. Вона швидко сховала малюнок у рюкзак.",
"Додому Даринка прийшла сумна. Дідусь Петро помітив це й покликав її в сад: «Допоможеш мені полити квіти?»",
"У саду дідусь запитав: «Як гадаєш, яка квітка тут найкраща?» Даринка роззирнулася. Троянда була пишна й гордовита. Ромашка — проста й весела. Соняшник виріс вищий за паркан. А незабудки були зовсім крихітні. «Не знаю… Вони всі різні».",
"«А чи треба ромашці сумувати, що вона не троянда?» Даринка засміялася: «Ні! Ромашка ж — ромашка!» — «А ти — Даринка, — сказав дідусь. — Ніхто у світі не малює котів так, як ти. Бог створив кожного особливим. У Біблії є слова: «Я дивовижно створений».",
"«Але Ілона малює краще». — «Ілона малює інакше. Ти можеш у неї повчитися й порадіти її коневі. Ти від цього не станеш меншою. Твоя цінність — не оцінка в щоденнику. Ти цінна, бо ти є. Бо тебе любить Бог і любимо ми».",
"Дідусь показав на горобчика, що купався в калюжі. «Ісус казав: жоден горобчик не забутий у Бога. І навіть волосинки на твоїй голові всі пораховані. Ти дорожча за багатьох горобчиків!»",
"Даринка дістала малюнок, домалювала котові вуса й сонце над головою. А наступного дня сказала Ілоні: «У тебе чудовий кінь!» Ілона зраділа: «А в тебе кіт такий смішний і добрий! Навчиш мене малювати такі очі?»",
"Увечері дідусь додав: «Цінувати себе — це ще й дбати про себе. Відпочивати, коли втомилася. Казати «ні», коли тобі щось неприємно. Просити про допомогу. І так само дбайливо ставитися до інших, бо вони теж — Божі квіти».",
"«Діду, а ти теж особливий?» — запитала Даринка. «Аякже! — засміявся дідусь. — Ніхто у світі не розповідає про горобчиків так довго, як я». І вони обоє розреготалися.",
"Даринка повісила кота над своїм ліжком. Він був неідеальний. Він був її. І він їй дуже подобався."],
se: [
"At the art club everyone was drawing their favourite animals. Darynka drew a cat. Then she glanced at her neighbour Ilona’s sheet — a horse was galloping there, just like a real one! Darynka looked at her cat: crooked ears, a tail like a sausage. She quickly hid the drawing in her backpack.",
"Darynka came home sad. Grandpa Petro noticed and called her into the garden: “Will you help me water the flowers?”",
"In the garden Grandpa asked, “Which flower here do you think is the best?” Darynka looked around. The rose was grand and proud. The daisy was simple and cheerful. The sunflower had grown taller than the fence. And the forget-me-nots were tiny. “I do not know… They are all different.”",
"“Should the daisy be sad that it is not a rose?” Darynka laughed. “No! A daisy is a daisy!” “And you are Darynka,” said Grandpa. “Nobody in the world draws cats the way you do. God made everyone special. The Bible has these words: ‘I am wonderfully made.’”",
"“But Ilona draws better.” “Ilona draws differently. You can learn from her and be glad about her horse. That will not make you smaller. Your worth is not a mark in a school diary. You are precious because you are you. Because God loves you, and so do we.”",
"Grandpa pointed to a sparrow bathing in a puddle. “Jesus said: not one sparrow is forgotten by God. And even the hairs on your head are all counted. You are worth more than many sparrows!”",
"Darynka took out her drawing and added whiskers to the cat and a sun above its head. The next day she told Ilona, “Your horse is wonderful!” Ilona beamed. “And your cat is so funny and kind! Will you teach me to draw eyes like that?”",
"In the evening Grandpa added, “Valuing yourself also means taking care of yourself. Resting when you are tired. Saying ‘no’ when something feels unpleasant. Asking for help. And treating others just as carefully, because they are God’s flowers too.”",
"“Grandpa, are you special too?” Darynka asked. “Of course!” Grandpa laughed. “Nobody in the world talks about sparrows for as long as I do.” And they both burst out laughing.",
"Darynka hung the cat above her bed. It was not perfect. It was hers. And she liked it very much."],
v: "Своїми словами: «Дякую Тобі, що я так дивовижно створений» (Псалом 139:14). Ісус сказав: жоден горобчик не забутий у Бога; ви дорожчі за багатьох горобчиків (Луки 12:6–7).|In simple words: “I thank You that I am so wonderfully made” (Psalm 139:14). Jesus said: not one sparrow is forgotten by God; you are worth more than many sparrows (Luke 12:6–7).",
idea: "Ти цінний не за оцінки чи перемоги. Ти цінний, бо ти є і тебе любить Бог.|You are precious not for marks or victories. You are precious because you are you and God loves you.",
ex: ["Коли в когось виходить краще, скажи: «Класно!» — і продовжуй робити по-своєму.|When someone does something better, say, “Great!” — and keep doing it your own way.",
"Якщо втомився — відпочинь. Дбати про себе — це добре.|If you are tired, rest. Taking care of yourself is good.",
"Якщо тобі щось неприємно, можна сказати «ні» й розповісти дорослому, якому довіряєш.|If something feels unpleasant, you can say “no” and tell a grown-up you trust."],
end: "У всьому світі є лише один такий, як ти. І тебе дуже люблять!|There is only one you in the whole world. And you are deeply loved!",
q: [
{k: "mc", q: "Що дідусь показав Даринці в саду?|What did Grandpa show Darynka in the garden?", o: ["Що всі квіти різні й гарні|That all flowers are different and lovely", "Що троянда найкраща|That the rose is the best", "Що квіти треба зрізати|That flowers must be cut"], a: 0, h: "Троянда, ромашка, соняшник, незабудки…|Rose, daisy, sunflower, forget-me-nots…", e: "Кожна квітка особлива. Як і кожна дитина!|Every flower is special. Just like every child!"},
{k: "tf", q: "Ромашці треба сумувати, що вона не троянда.|A daisy should be sad that it is not a rose.", a: 0, h: "Що відповіла Даринка й засміялася?|What did Darynka answer, laughing?", e: "Ні! Ромашка прекрасна, бо вона ромашка.|No! A daisy is beautiful because it is a daisy."},
{k: "fill", q: "Я цінний, бо ___.|I am precious because ___.", o: ["я ніколи не помиляюся|I never make mistakes", "я найкращий у класі|I am the best in class", "мене любить Бог|God loves me"], a: 2, h: "Цінність — не оцінка в щоденнику.|Worth is not a mark in a school diary.", e: "Ти цінний, бо ти є і тебе любить Бог.|You are precious because you are you and God loves you."},
{k: "pair", q: "З’єднай слова Ісуса.|Match the words of Jesus.", p: [["Горобчик|A sparrow", "не забутий у Бога|is not forgotten by God"], ["Волосинки|Your hairs", "усі пораховані|are all counted"], ["Ти|You", "дорожчий за багатьох горобчиків|are worth more than many sparrows"]], h: "Про це дідусь розповів біля калюжі.|Grandpa told about it near the puddle.", e: "Бог знає й любить тебе до найменшої волосинки!|God knows and loves you down to the tiniest hair!"},
{k: "mc", q: "Що Даринка сказала Ілоні наступного дня?|What did Darynka say to Ilona the next day?", o: ["Нічого|Nothing", "«У тебе чудовий кінь!»|“Your horse is wonderful!”", "«Я малюю краще»|“I draw better”"], a: 1, h: "Вона щиро порадувала подругу.|She gladdened her friend sincerely.", e: "Радіти за інших легко, коли знаєш, що й ти цінний.|It is easy to be glad for others when you know you are precious too."}]
});
LS.push({
em: ["🛴", "🤝", "💛"], game: "memory",
t: "Прощення та доброта|Forgiveness and Kindness",
ref: "Луки 10:30–37; Ефесян 4:32|Luke 10:30–37; Ephesians 4:32",
su: [
"Максим і Данило були сусідами й найкращими друзями. Якось Максимові подарували новенький самокат. «Дай покататися!» — попросив Данило. Він розігнався, не помітив бордюр — бабах! Переднє колесо зігнулося.",
"«Ти його зламав! — закричав Максим. — Я з тобою більше не дружу!» Данило почервонів і побіг додому. Обом було дуже зле.",
"Максим сидів на ґанку надутий. До нього підсіла бабуся Ганна. Вона вислухала все, а потім сказала: «Розповім тобі історію, яку розповідав Ісус».",
"«Один чоловік ішов дорогою, і на нього напали розбійники. Вони побили його й залишили при дорозі. Повз проходили двоє поважних людей. Вони побачили бідолаху, але пройшли мимо. А потім їхав самарянин — чужинець з іншого народу. Він зупинився, перев’язав рани, посадив чоловіка на свого ослика, відвіз до заїзду й заплатив господареві, щоб той про нього подбав».",
"«А чому він зупинився?» — запитав Максим. «Бо мав добре серце. Милосердя — це коли бачиш чужу біду й не проходиш мимо».",
"«Данилові зараз теж біда, — вела далі бабуся. — Йому соромно й сумно. Та й тобі нелегко: образа лежить на серці, як важкий камінь. Пробачити — означає покласти цей камінь на землю».",
"«Але ж колесо все одно криве!» — «Так. Пробачити — не означає сказати, що нічого не сталося. Це означає вирішити, що друг важливіший за колесо. А колесо можна полагодити разом».",
"Максим пішов до сусідів. Данило відчинив двері із заплаканими очима: «Пробач. Я не хотів». — «Я пробачаю. І ти пробач, що я кричав».",
"Разом із Даниловим татом вони вирівняли колесо. Данило сам приніс зі своєї скарбнички гроші на новий болтик — ніхто його не змушував, йому просто хотілося допомогти. А ввечері друзі каталися по черзі й реготали на весь двір.",
"Бабуся Ганна дивилася на них із ґанку й усміхалася. «Бачиш, — сказала вона Максимовій мамі, — самокат полагодили за пів години. А дружбу — за одну хвилину. Досить було двох слів: «пробач» і «пробачаю».",
"У Біблії написано: «Будьте добрі одне до одного, милосердні, прощайте одне одному, як і Бог простив вам»."],
se: [
"Maksym and Danylo were neighbours and best friends. One day Maksym was given a brand-new scooter. “Let me have a ride!” Danylo asked. He sped up, did not notice the kerb — bang! The front wheel got bent.",
"“You broke it!” Maksym shouted. “I am not your friend any more!” Danylo turned red and ran home. Both of them felt awful.",
"Maksym sat on the porch sulking. Grandma Hanna sat down next to him. She listened to everything and then said, “Let me tell you a story that Jesus told.”",
"“A man was walking along a road, and robbers attacked him. They beat him and left him by the roadside. Two respected men passed by. They saw the poor man but walked on. Then a Samaritan came riding — a stranger from another people. He stopped, bandaged the wounds, put the man on his own donkey, took him to an inn and paid the innkeeper to take care of him.”",
"“Why did he stop?” Maksym asked. “Because he had a kind heart. Mercy is when you see someone’s trouble and do not pass by.”",
"“Danylo is in trouble now too,” Grandma went on. “He feels ashamed and sad. And it is not easy for you either: the hurt lies on your heart like a heavy stone. To forgive means to put that stone down on the ground.”",
"“But the wheel is still bent!” “Yes. Forgiving does not mean saying that nothing happened. It means deciding that your friend matters more than the wheel. And the wheel can be fixed together.”",
"Maksym went to the neighbours’ house. Danylo opened the door with teary eyes: “I am sorry. I did not mean to.” “I forgive you. And forgive me for shouting.”",
"Together with Danylo’s dad they straightened the wheel. Danylo brought money from his own piggy bank for a new bolt — nobody made him, he simply wanted to help. And in the evening the friends took turns riding and laughed so the whole yard could hear.",
"Grandma Hanna watched them from the porch and smiled. “See,” she said to Maksym’s mum, “the scooter took half an hour to fix. And the friendship took one minute. Two words were enough: ‘sorry’ and ‘I forgive you’.”",
"The Bible says: “Be kind to one another, tender-hearted, forgiving one another, as God forgave you.”"],
v: "Своїми словами: «Будьте добрі одне до одного, милосердні, прощайте одне одному, як і Бог через Христа простив вам» (Ефесян 4:32).|In simple words: “Be kind to one another, tender-hearted, forgiving one another, as God in Christ forgave you” (Ephesians 4:32).",
idea: "Прощення звільняє серце від важкого каменя, а доброта помічає чужу біду й допомагає.|Forgiveness frees the heart from a heavy stone, and kindness notices someone’s trouble and helps.",
ex: ["Якщо посварився з другом, зроби перший крок: «Пробач, давай миритися».|If you quarrelled with a friend, take the first step: “Sorry, let us make up.”",
"Якщо хтось упав на перерві, підійди й допоможи підвестися.|If someone falls down at break time, go and help them up.",
"Якщо тебе скривдили й тобі боляче, розкажи дорослому. Пробачати не означає терпіти кривду мовчки.|If someone hurt you and it is painful, tell a grown-up. Forgiving does not mean putting up with hurt in silence."],
end: "Добре серце робить світ теплішим. У тебе саме таке!|A kind heart makes the world warmer. You have one just like that!",
q: [
{k: "mc", q: "Хто допоміг побитому чоловікові на дорозі?|Who helped the beaten man on the road?", o: ["Розбійники|The robbers", "Самарянин|The Samaritan", "Ніхто|Nobody"], a: 1, h: "Це був чужинець з іншого народу.|He was a stranger from another people.", e: "Самарянин зупинився й подбав про нього.|The Samaritan stopped and took care of him."},
{k: "tf", q: "Пробачити — означає вдавати, що нічого не сталося.|To forgive means to pretend that nothing happened.", a: 0, h: "Що бабуся сказала про колесо?|What did Grandma say about the wheel?", e: "Пробачити — це вирішити, що друг важливіший за колесо.|To forgive is to decide your friend matters more than the wheel."},
{k: "fill", q: "«Будьте добрі одне до одного, ___ одне одному».|“Be kind to one another, ___ one another.”", o: ["прощайте|forgive", "забувайте|forget", "перемагайте|defeat"], a: 0, h: "Так вчинив Максим на порозі Данила.|That is what Maksym did at Danylo’s door.", e: "«Прощайте одне одному» (Ефесян 4:32).|“Forgiving one another” (Ephesians 4:32)."},
{k: "order", q: "Розстав події історії про друзів.|Put the events of the friends’ story in order.", s: ["Данило зігнув колесо самоката|Danylo bent the scooter wheel", "Максим розсердився й накричав|Maksym got angry and shouted", "Бабуся розповіла історію Ісуса|Grandma told the story of Jesus", "Друзі помирилися й полагодили колесо|The friends made up and fixed the wheel"], h: "Спочатку — бабах, наприкінці — сміх.|First a bang, laughter at the end.", e: "Так! Примирення — найкращий кінець історії.|Yes! Making up is the best ending."},
{k: "mc", q: "На що схожа образа в цій історії?|What is a hurt feeling like in this story?", o: ["На пір’їнку|A feather", "На важкий камінь на серці|A heavy stone on the heart", "На цукерку|A sweet"], a: 1, h: "Її можна покласти на землю.|You can put it down on the ground.", e: "Пробачити — це покласти камінь на землю. Стає легко!|To forgive is to put the stone down. It feels light!"}]
});

LS.push({
em: ["🚲", "🤲", "🐦"], game: "maze",
t: "Віра — це довіра|Faith Is Trust",
ref: "Приповісті 3:5; Матвія 6:26|Proverbs 3:5; Matthew 6:26",
su: [
"Яринці подарували двоколісний велосипед. Тато відкрутив маленькі бічні коліщатка й сказав: «Час кататися по-справжньому!» Яринка сіла на сидіння — і велосипед одразу захитався. Ой, як лячно!",
"«Я триматиму сидіння, — пообіцяв тато. — Ти просто крути педалі й дивися вперед». — «А ти не відпустиш?» — «Я буду поруч. Обіцяю».",
"Яринка натиснула на педалі. Вона не бачила татової руки, бо та була позаду. Та вона подумала: «Тато ще ніколи мене не підводив. Він ловив мене з гірки. Він завжди приходив по мене в садочок. Отже, йому можна довіряти».",
"І вона поїхала! Спершу повільно, потім швидше. Вітер лоскотав щоки, а тато біг поруч. Один раз Яринка впала на траву. Тато допоміг підвестися, подмухав на коліно й усміхнувся: «Падати — це частина навчання. Ще раз?» — «Ще раз!»",
"Увечері Яринка запитала: «Тату, а що таке віра? Бабуся каже: «Май віру в Бога». Тато подумав і відповів: «Віра — це довіра. Сьогодні ти довіряла мені. Не тому, що бачила мою руку, а тому, що знаєш мене. З Богом так само: ми Його не бачимо, але знаємо, який Він, бо Ісус нам Його показав».",
"«Ісус якось сказав: погляньте на пташок. Вони не сіють і не збирають у комори, а Небесний Отець годує їх. А ви ж для Нього ще дорожчі!»",
"«А якщо мені все одно буде страшно?» — «Тоді так і скажи: «Боже, мені трошки страшно. Будь поруч». Це теж довіра. Віра — не іспит, який можна не скласти. Це рука, за яку можна триматися».",
"«А якщо я не все розумію?» — «І я не все розумію, — засміявся тато. — Довіряти — не означає знати всі відповіді. Це означає знати, Хто тебе любить».",
"Яринка довго дивилася у вікно, де на гілці сиділи два горобчики. «Вони зовсім не хвилюються», — сказала вона. «Бо знають, що про них дбають, — відповів тато. — І про тебе теж».",
"У Біблії є такі слова: «Довіряй Господу всім своїм серцем». Яринка повторила їх пошепки, обійняла тата й побігла дивитися на свій велосипед. Завтра вона знову кататиметься. І вже зовсім не боятиметься."],
se: [
"Yarynka got a two-wheeled bicycle. Dad unscrewed the little side wheels and said, “Time to ride for real!” Yarynka sat on the seat — and the bicycle began to wobble at once. Oh, how scary!",
"“I will hold the seat,” Dad promised. “You just pedal and look ahead.” “You will not let go?” “I will be right beside you. I promise.”",
"Yarynka pushed the pedals. She could not see Dad’s hand because it was behind her. But she thought, “Dad has never let me down. He caught me at the slide. He always came for me at kindergarten. So I can trust him.”",
"And off she went! Slowly at first, then faster. The wind tickled her cheeks, and Dad ran alongside. Once Yarynka fell onto the grass. Dad helped her up, blew on her knee and smiled: “Falling is part of learning. Once more?” “Once more!”",
"In the evening Yarynka asked, “Dad, what is faith? Grandma says, ‘Have faith in God.’” Dad thought and answered, “Faith is trust. Today you trusted me. Not because you saw my hand, but because you know me. It is the same with God: we do not see Him, but we know what He is like, because Jesus showed Him to us.”",
"“Jesus once said: look at the birds. They do not sow or gather into barns, and yet the Heavenly Father feeds them. And you are even more precious to Him!”",
"“What if I am still scared?” “Then just say so: ‘God, I am a little scared. Be near me.’ That is trust too. Faith is not an exam you can fail. It is a hand you can hold.”",
"“And what if I do not understand everything?” “I do not understand everything either,” Dad laughed. “Trusting does not mean knowing all the answers. It means knowing Who loves you.”",
"Yarynka looked out of the window for a long time; two sparrows were sitting on a branch. “They are not worried at all,” she said. “Because they know they are cared for,” Dad answered. “And so are you.”",
"The Bible has these words: “Trust in the Lord with all your heart.” Yarynka repeated them in a whisper, hugged Dad and ran to look at her bicycle. Tomorrow she would ride again. And she would not be afraid at all."],
v: "Своїми словами: «Довіряй Господу всім своїм серцем» (Приповісті 3:5). «Погляньте на птахів небесних: Отець ваш Небесний годує їх. Хіба ви не дорожчі за них?» (Матвія 6:26).|In simple words: “Trust in the Lord with all your heart” (Proverbs 3:5). “Look at the birds of the air: your Heavenly Father feeds them. Are you not worth more than they?” (Matthew 6:26).",
idea: "Вірити — означає довіряти Богові, як дитина довіряє люблячому татові.|To believe means to trust God the way a child trusts a loving dad.",
ex: ["Коли сідаєш на стілець, ти не перевіряєш кожну ніжку — ти довіряєш. Так і з Богом.|When you sit on a chair you do not check every leg — you trust. It is the same with God.",
"Коли хвилюєшся перед виступом, скажи: «Боже, будь поруч» — і зроби крок.|When you are nervous before a performance, say, “God, be near me” — and take a step.",
"Коли чогось не розумієш, можна чесно запитати. Запитання — це не слабка віра, а цікавість.|When you do not understand something, you can honestly ask. Questions are not weak faith, they are curiosity."],
end: "Віра — це рука, за яку можна триматися. Вона завжди простягнута до тебе!|Faith is a hand you can hold. It is always reaching out to you!",
q: [
{k: "mc", q: "Чому Яринка довіряла татові?|Why did Yarynka trust her dad?", o: ["Бо бачила його руку|Because she saw his hand", "Бо знала, що він її не підводив|Because she knew he had never let her down", "Бо він наказав|Because he ordered her"], a: 1, h: "Рука була позаду, але Яринка знала тата.|The hand was behind her, but Yarynka knew her dad.", e: "Довіра росте, коли ми знаємо того, хто нас любить.|Trust grows when we know the one who loves us."},
{k: "tf", q: "Віра — це іспит, який можна не скласти.|Faith is an exam you can fail.", a: 0, h: "Тато порівняв віру з рукою.|Dad compared faith to a hand.", e: "Віра — не іспит. Це рука, за яку можна триматися.|Faith is not an exam. It is a hand you can hold."},
{k: "fill", q: "Віра — це ___.|Faith is ___.", o: ["довіра|trust", "змагання|a competition", "таємниця для дорослих|a secret for grown-ups"], a: 0, h: "Це слово є в назві уроку.|This word is in the lesson title.", e: "Віра — це довіра Богові.|Faith is trust in God."},
{k: "pair", q: "З’єднай пари.|Match the pairs.", p: [["Пташок|The birds", "годує Небесний Отець|are fed by the Heavenly Father"], ["Тато|Dad", "біг поруч із велосипедом|ran beside the bicycle"], ["Яринка|Yarynka", "крутила педалі й довіряла|pedalled and trusted"]], h: "Хто що робив у цій історії?|Who did what in this story?", e: "Так! А ти для Отця дорожчий за всіх пташок.|Yes! And you are worth more to the Father than all the birds."},
{k: "mc", q: "Що можна сказати Богові, коли страшно?|What can you say to God when you are scared?", o: ["Нічого, треба мовчати|Nothing, you must be silent", "«Боже, мені страшно. Будь поруч»|“God, I am scared. Be near me”", "«Я більше не вірю»|“I do not believe any more”"], a: 1, h: "Чесні слова — це теж довіра.|Honest words are trust too.", e: "Богові можна чесно сказати про все.|You can honestly tell God about everything."}]

t: "Свобода у Христі|Freedom in Christ",
ref: "Галатів 5:1, 13|Galatians 5:1, 13",
su: [
"Назар із дідусем Степаном ішли стежкою повз грядки. Раптом із полуниці почулося тоненьке: «Пі-пі-пі!» У старій сітці, якою накривали ягоди, заплутався щиглик. Він бив крильцями, але нитки тримали міцно.",
"Дідусь обережно взяв пташку в долоні. «Тихенько, маленький. Назаре, неси ножиці». Назар різав нитку за ниткою. Він відчував, як швидко-швидко б’ється крихітне серденько.",
"Нарешті остання нитка впала. Щиглик хвильку посидів на долоні, стріпнув пір’ячком — і злетів на верхівку вишні. А там заспівав так дзвінко, що аж листя затремтіло.",
"«Діду, а давай візьмемо його в клітку! Я годуватиму його найкращим зерном!» Дідусь похитав головою: «А чи співав би він у клітці так, як зараз? Він створений, щоб літати».",
"Вони сіли на лавку. «Знаєш, люди теж заплутуються в сітках, — сказав дідусь. — Тільки в невидимих. Одна сітка — страх: «Я недостатньо хороший». Інша — думка: «Любов треба заслужити». Ще одна — образа. Ісус прийшов, щоб перерізати ці нитки. У Біблії написано: Христос визволив нас для свободи — тож стійте й не заплутуйтеся знову».",
"«То свобода — це коли можна робити все, що схочеш? Не вчити уроки і їсти самі цукерки?» Дідусь засміявся: «Щиглик вільний. Та хіба він летить у шибку чи клює своїх друзів? Свобода — не для того, щоб шкодити собі чи іншим. У Біблії далі сказано: ви покликані до свободи, тож любов’ю служіть одне одному. Свобода — це крила. А любов підказує, куди летіти».",
"«А обов’язки?» — «Відповідальність — теж не клітка. Коли ти годуєш кота, бо любиш його, а не тому, що боїшся сварки, — ти і вільний, і добрий водночас».",
"Наступного дня Назар із дідусем зняли стару сітку й повісили на вишні годівничку. І щиглик прилетів — сам, з власної волі. Він клював насіння й поглядав на Назара блискучим оком.",
"«Ось вона, найкраща дружба, — сказав дідусь. — Без клітки».",
"Щиглик дзьобнув останню зернину, цвірінькнув щось веселе й полетів у синє небо. Але Назар знав: завтра він прилетить знову. Бо туди, де тебе люблять, завжди хочеться повертатися.",
"Назар усміхнувся. Йому здалося, що в нього самого за спиною теж є маленькі крила."],
se: [
"Nazar and Grandpa Stepan were walking along the path past the garden beds. Suddenly a thin “Peep-peep-peep!” came from the strawberries. A goldfinch was tangled in the old net that covered the berries. It beat its wings, but the threads held tight.",
"Grandpa carefully took the bird in his hands. “Easy, little one. Nazar, bring the scissors.” Nazar cut thread after thread. He could feel the tiny heart beating fast, fast.",
"At last the final thread fell. The goldfinch sat on the palm for a moment, shook its feathers — and flew up to the top of the cherry tree. There it sang so brightly that the leaves seemed to tremble.",
"“Grandpa, let us keep it in a cage! I will feed it the best seeds!” Grandpa shook his head. “Would it sing in a cage the way it sings now? It was made to fly.”",
"They sat down on a bench. “You know, people get tangled in nets too,” said Grandpa. “Only invisible ones. One net is fear: ‘I am not good enough.’ Another is the thought: ‘Love must be earned.’ One more is a grudge. Jesus came to cut these threads. The Bible says: Christ set us free for freedom — so stand firm and do not get tangled again.”",
"“So freedom is when you can do anything you want? Skip homework and eat only sweets?” Grandpa laughed. “The goldfinch is free. But does it fly into a window or peck its friends? Freedom is not for harming yourself or others. The Bible goes on: you were called to freedom, so serve one another with love. Freedom is wings. And love shows where to fly.”",
"“And what about duties?” “Responsibility is not a cage either. When you feed the cat because you love it, and not because you are afraid of being scolded, you are both free and kind at the same time.”",
"The next day Nazar and Grandpa took down the old net and hung a bird feeder on the cherry tree. And the goldfinch came — by itself, of its own free will. It pecked the seeds and glanced at Nazar with a shiny eye.",
"“Here it is, the best kind of friendship,” said Grandpa. “Without a cage.”",
"The goldfinch pecked the last seed, chirped something cheerful and flew off into the blue sky. But Nazar knew it would come again tomorrow. Because you always want to return to where you are loved.",
"Nazar smiled. It seemed to him that he, too, had little wings behind his back."],
v: "Своїми словами: «Христос визволив нас для свободи, тож стійте» (Галатів 5:1). «Ви покликані до свободи… любов’ю служіть одне одному» (Галатів 5:13).|In simple words: “Christ set us free for freedom, so stand firm” (Galatians 5:1). “You were called to freedom… serve one another with love” (Galatians 5:13).",
idea: "Ісус звільняє нас від страху й думки, що любов треба заслужити. Свобода — це крила, а любов показує, куди летіти.|Jesus frees us from fear and from the thought that love must be earned. Freedom is wings, and love shows where to fly.",
ex: ["Ти вільний сказати: «Я помилився» — і тебе не перестануть любити.|You are free to say, “I made a mistake” — and you will not stop being loved.",
"Ти вільний обирати добре: поділитися, допомогти, зупинити сварку.|You are free to choose what is good: to share, to help, to stop a quarrel.",
"Коли прибираєш іграшки, бо дбаєш про дім, а не зі страху, — це відповідальність вільної людини.|When you tidy your toys because you care about your home, not out of fear, that is the responsibility of a free person."],
end: "У тебе є крила свободи. Лети туди, де любов!|You have wings of freedom. Fly to where love is!",
q: [
{k: "mc", q: "У чому заплутався щиглик?|What was the goldfinch tangled in?", o: ["У старій сітці|In an old net", "У гілках вишні|In cherry branches", "У дідусевій шапці|In Grandpa’s hat"], a: 0, h: "Нею накривали полуницю.|It covered the strawberries.", e: "У сітці. Назар із дідусем перерізали нитки.|In a net. Nazar and Grandpa cut the threads."},
{k: "tf", q: "Свобода — це робити що завгодно, навіть якщо це шкодить іншим.|Freedom means doing anything, even if it hurts others.", a: 0, h: "Хіба вільний щиглик клює своїх друзів?|Does the free goldfinch peck its friends?", e: "Свобода — це крила, а любов підказує, куди летіти.|Freedom is wings, and love shows where to fly."},
{k: "fill", q: "«Любов’ю ___ одне одному».|“___ one another with love.”", o: ["керуйте|Rule", "служіть|Serve", "хваліться|Boast to"], a: 1, h: "Це означає допомагати й дбати.|It means helping and caring.", e: "«Любов’ю служіть одне одному» (Галатів 5:13).|“Serve one another with love” (Galatians 5:13)."},
{k: "order", q: "Розстав події історії про щиглика.|Put the events of the goldfinch story in order.", s: ["Назар і дідусь почули писк|Nazar and Grandpa heard a peep", "Вони перерізали нитки|They cut the threads", "Щиглик злетів і заспівав|The goldfinch flew up and sang", "Пташка сама прилетіла до годівнички|The bird came to the feeder by itself"], h: "Годівничку повісили наступного дня.|The feeder was hung the next day.", e: "Так! Найкраща дружба — без клітки.|Yes! The best friendship has no cage."},
{k: "mc", q: "Які «невидимі сітки» перерізає Ісус?|Which “invisible nets” does Jesus cut?", o: ["Шнурки на кросівках|Shoelaces", "Страх і думку, що любов треба заслужити|Fear and the thought that love must be earned", "Дружбу|Friendship"], a: 1, h: "Про них дідусь розповів на лавці.|Grandpa spoke about them on the bench.", e: "Ісус звільняє від страху. Любов — це подарунок!|Jesus frees us from fear. Love is a gift!"}]

em: ["👧", "🍎", "👧"], game: "garden",
t: "Як любити інших|How to Love Others",
ref: "Івана 13:34; 1 Коринтян 13:4–7|John 13:34; 1 Corinthians 13:4–7",
su: [
"У понеділок до третього «Б» прийшла нова дівчинка. «Це Мілана, — сказала вчителька. — Вона переїхала до нас з іншого міста». Мілана стояла біля дверей і міцно притискала до себе рюкзак.",
"На перерві всі побігли гратися в квача. Мілана залишилася сама біля вікна. Софійка це помітила. Їй дуже хотілося гратися, та вона згадала свій перший день у басейні: тоді з нею ніхто не заговорив, і було так самотньо.",
"Софійка підійшла до вікна. «Привіт! Я Софійка. Хочеш гратися з нами?» Мілана вперше за цілий день усміхнулася.",
"На обіді з’ясувалося, що Мілана забула вдома канапку. Софійка розламала свою булочку навпіл і дала їй яблуко. Після уроків вона показала, де бібліотека й де найкраща гойдалка у дворі.",
"Та не все було просто. Софійчина подружка Катя надулася: «То ти тепер із новенькою дружиш, а не зі мною?» Софійка взяла її за руку: «Катю, ти моя подруга. Любов — не пиріг, який закінчується. Її вистачить на всіх. Ходімо втрьох!»",
"Удома Софійка розповіла все мамі. «Ти зробила саме те, про що просив Ісус, — сказала мама. — Він казав: «Любіть одне одного, як Я полюбив вас». Любов — це не лише слова. Це справи: помітити, привітатися, поділитися, вислухати, заступитися».",
"Мама розгорнула Біблію й прочитала: любов терпляча й добра, вона не заздрить, не вихваляється, не шукає лише свого. «Спробуй поставити сюди своє ім’я: «Софійка терпляча, Софійка добра…» Софійка захихотіла: «Я ще тільки вчуся». — «Ми всі вчимося, — усміхнулася мама. — І вчитися нам легко, бо нас самих полюбили першими».",
"«А якщо хтось не захоче зі мною дружити?» — «Таке буває. Ти не мусиш усім подобатися. Але можеш до всіх ставитися по-доброму — і берегти себе теж».",
"Наступного ранку Софійка прийшла до школи раніше й поклала на Міланину парту маленьку записку: «Гарного дня!» Мілана прочитала, озирнулася й помахала їй рукою. Від цього в Софійки на серці стало тепло-тепло.",
"За тиждень на естафеті Софійка, Катя й Мілана стали найдружнішою командою. А Мілана подарувала Софійці листівку з трьома дівчатками й написом: «Дякую, що ти мене помітила»."],
se: [
"On Monday a new girl came to class 3B. “This is Milana,” said the teacher. “She has moved here from another town.” Milana stood by the door, hugging her backpack tightly.",
"At break time everyone ran off to play tag. Milana stayed alone by the window. Sofiika noticed. She really wanted to play, but she remembered her own first day at the swimming pool: nobody spoke to her then, and she felt so lonely.",
"Sofiika walked up to the window. “Hi! I am Sofiika. Do you want to play with us?” Milana smiled for the first time that day.",
"At lunch it turned out that Milana had left her sandwich at home. Sofiika broke her bun in half and gave her an apple. After lessons she showed her where the library was and where to find the best swing in the yard.",
"But not everything was simple. Sofiika’s friend Katia sulked: “So now you are friends with the new girl and not with me?” Sofiika took her hand. “Katia, you are my friend. Love is not a pie that runs out. There is enough for everyone. Let us go, all three of us!”",
"At home Sofiika told Mum everything. “You did exactly what Jesus asked,” said Mum. “He said, ‘Love one another as I have loved you.’ Love is not only words. It is actions: to notice, to say hello, to share, to listen, to stand up for someone.”",
"Mum opened the Bible and read: love is patient and kind, it does not envy, does not boast, does not seek only its own. “Try putting your name here: ‘Sofiika is patient, Sofiika is kind…’” Sofiika giggled. “I am only learning.” “We are all learning,” Mum smiled. “And it is easy for us to learn, because we ourselves were loved first.”",
"“What if someone does not want to be my friend?” “That happens. You do not have to be liked by everyone. But you can treat everyone kindly — and take care of yourself too.”",

su: [
"У саду біля Школи Божої любові готувалося велике свято. Сонечко Радість розвішувало на деревах світлі гірлянди. Зайчик Добрик носив морквяні пиріжки. Пташка Надійка повторювала святкову пісеньку. А Ведмедик Мирко ставив довгий-предовгий стіл — щоб місця вистачило всім.",
"Першими прийшли діти. Марко привів тата. Оля принесла фарби. Тимко — малюнок із великим серцем. Даринка — свого смішного кота. Максим і Данило приїхали на одному самокаті. Яринка — на велосипеді. Назар приніс годівничку, а Софійка прийшла разом із Міланою та Катею.",
"«Нехай кожен розкаже, що він відкрив!» — защебетала Надійка.",
"«Бог — люблячий Тато. Він шукає нас і радіє нам», — сказав Марко. «Благодать — це подарунок, його не купують», — додала Оля. «Любов сильніша за страх», — мовив Тимко. «Я цінна такою, як я є», — усміхнулася Даринка.",
"«Пробачити — це покласти важкий камінь на землю», — сказали разом Максим і Данило. «Віра — це довіра», — озвалася Яринка. «Свобода — це крила, а любов показує, куди летіти», — промовив Назар. «А любов — це справи», — закінчила Софійка.",
"Ведмедик Мирко тихенько запитав: «А якщо хтось усе це забуде? Або знову помилиться?» Сонечко засяяло ще яскравіше: «Тоді в головному нічого не зміниться. У Біблії написано: ніщо не може відлучити нас від Божої любові. Ні висота, ні глибина, ні сьогоднішній день, ні завтрашній».",
"«Пам’ятаєте батька з історії Ісуса? — додала Надійка. — Його двері завжди відчинені, і він сам влаштовує свято. Наше свято — маленька картинка тієї великої радості. Тут є місце для кожного. Зайвих немає».",
"Заграла музика, і всі стали в хоровод. Над садом засяяла веселка. Зайчик Добрик підстрибнув: «А школа ж не закінчується! Щодня є новий урок любові: удома, у школі й у дворі!»",

se: [
"In the garden near the School of God’s Love a great celebration was being prepared. Sunny Joy was hanging bright garlands on the trees. Bunny Dobryk was carrying carrot pies. Birdie Nadiyka was practising a festive song. And Teddy Myrko was setting a long, long table — so that there would be room for everyone.",
"The children came first. Marko brought his dad. Olia brought her paints. Tymko brought a drawing with a big heart. Darynka brought her funny cat. Maksym and Danylo arrived on one scooter. Yarynka came on her bicycle. Nazar brought a bird feeder, and Sofiika came together with Milana and Katia.",
"“Let everyone tell what they have discovered!” chirped Nadiyka.",
"“God is a loving Dad. He looks for us and is glad about us,” said Marko. “Grace is a gift; it is not bought,” added Olia. “Love is stronger than fear,” said Tymko. “I am precious just as I am,” smiled Darynka.",
"“To forgive is to put a heavy stone down,” Maksym and Danylo said together. “Faith is trust,” said Yarynka. “Freedom is wings, and love shows where to fly,” said Nazar. “And love is actions,” Sofiika finished.",
"Teddy Myrko asked quietly, “What if someone forgets all this? Or makes a mistake again?” Sunny shone even brighter: “Then nothing changes in what matters most. The Bible says: nothing can separate us from God’s love. Neither height nor depth, neither today nor tomorrow.”",
"“Remember the father from Jesus’ story?” Nadiyka added. “His door is always open, and he himself prepares the feast. Our celebration is a little picture of that great joy. There is a place here for everyone. Nobody is left out.”",
"Music began to play, and everyone joined a circle dance. A rainbow shone above the garden. Bunny Dobryk jumped up: “But the school does not end! Every day there is a new lesson of love: at home, at school and in the yard!”",
"Nadiyka sang: “God is love, and whoever lives in love lives in God, and God lives in them.”",
"Teddy Myrko cut a big honey pie, and everyone got a piece. The strangest thing was that the pie never ran out: the more they shared, the more there was. “It is like love,” Sofiika whispered.",
"And you, dear friend, were at this celebration too. You have walked the whole way. Remember the most important thing: you are loved. Today, tomorrow and always."],
v: "Своїми словами: ніщо у всьому світі не може відлучити нас від Божої любові (Римлян 8:38–39). «Бог є любов, і хто перебуває в любові, той перебуває в Бозі» (1 Івана 4:16).|In simple words: nothing in the whole world can separate us from God’s love (Romans 8:38–39). “God is love, and whoever lives in love lives in God” (1 John 4:16).",
idea: "Божа любов — назавжди. Ніщо не може її забрати, і місце на святі є для кожного.|God’s love is forever. Nothing can take it away, and there is a place at the celebration for everyone.",

    ["Це гра, а не тест духовності|It is a game, not a test of spirituality", "Зірочки й нагороди показують пройдений шлях, а не «рівень віри». Відповіді дитини не оцінюють її особистість. За помилки немає штрафів: Ведмедик Мирко дає підказку, і можна спробувати ще раз.|Stars and awards show the path travelled, not a “level of faith”. A child’s answers do not grade who they are. There are no penalties for mistakes: Teddy Myrko gives a hint and the child can try again."],

    ["Про натхнення|About the inspiration", "Проєкт натхненний тематикою вчення пастора Віктора Томєва про Божу любов, благодать і вічне життя. Це не його офіційний сайт і не офіційний навчальний продукт. У текстах немає цитат пастора: усі пояснення — авторські дитячі перекази біблійних текстів.|The project is inspired by the themes of Pastor Viktor Tomev’s teaching on God’s love, grace and eternal life. It is not his official website or an official educational product. The texts contain no quotations from the pastor: all explanations are the author’s retellings of Bible texts for children."],
    ["Збереження та приватність|Saving and privacy", "Прогрес, налаштування та ім’я на дипломі зберігаються лише в пам’яті браузера цього пристрою (localStorage). Сайт нічого не надсилає в інтернет, не має реклами, аналітики, чатів і форм. Якщо очистити дані браузера, прогрес зникне.|Progress, settings and the diploma name are stored only in this device’s browser memory (localStorage). The site sends nothing to the internet and has no ads, analytics, chats or forms. If browser data is cleared, the progress will be lost."],
