  var s = say("bunny", tr("Я Зайчик Добрик! Обирай пригоду. У кожній грі я поясню, що робити.|I am Bunny Dobryk! Choose an adventure. In every game I will explain what to do.")), i, g;
  for (i = 0; i < GAMES.length; i++) { g = GAMES[i]; s += '<button class="item" data-a="game:' + g[0] + '"><span class="em">' + g[1] + '</span><span class="tx">' + tr(g[2]) + "<small>" + (ST.rec[g[0]] == null ? tr("Ще не грали|Not played yet") : tr("Рекорд: |Record: ") + ST.rec[g[0]] + " " + tr(g[4])) + '</small></span><span class="ok">▶</span></button>'; }
  return s;
};
ACT.game = function (id) { sfx("tap"); go("g_" + id, {st: "intro"}); };
ACT.gstart = function () { var n = V.n, r = V.ret; leave(); V = {n: n, st: "play", ret: r}; draw(); window.scrollTo(0, 0); };
ACT.gret = function () { go("lesson", {i: V.ret, s: 3}); };
function gWrap(id, play) {
  var g = gameInfo(id), s;
  if (V.st === "intro") return '<div class="card center"><div style="font-size:60px">' + g[1] + "</div><h2>" + tr(g[2]) + "</h2></div>" + say("bunny", tr(g[3])) + B("▶ " + tr("Почати|Start"), "gstart", "b2") + (V.ret != null ? B(tr("Назад до уроку|Back to the lesson"), "gret", "b5") : B(tr("До всіх ігор|All games"), "go:games", "b5"));
  if (V.st === "end") {
    s = '<div class="starpop">🎉</div><h2 class="center">' + tr("Гру завершено!|Game complete!") + "</h2>" + cheer() + '<div class="card center"><p><b>' + V.res + "</b></p></div>" + B("🔁 " + tr("Грати ще раз|Play again"), "gstart", "b2");
    if (V.ret != null) s += B(tr("Назад до уроку ➜|Back to the lesson ➜"), "gret");
    return s + B(tr("До всіх ігор|All games"), "go:games", "b5");
  }
  return play();
}
function gEnd(res, key, val, lower) {
  if (V.stop) { V.stop(); V.stop = null; }
  var r = ST.rec[key];
  if (lower) { if (r == null || val < r) ST.rec[key] = val; } else ST.rec[key] = (r || 0) + 1;
  save(); V.st = "end"; V.res = res; V.kd = null; V.ku = null;
  confetti(); sfx("win"); draw(); window.scrollTo(0, 0);
}

/* 1. hearts */
VIEWS.g_hearts = function () { return gWrap("hearts", function () { return '<div class="hud"><span>❤️ <b id="hc">0</b>/12</span><span>⏱ <b id="ht">0</b> ' + tr("с|s") + '</span></div><canvas id="cv" class="cv"></canvas><p class="small center">' + tr("Торкнися місця, куди бігти зайчикові, або керуй стрілками.|Touch where the bunny should run, or use the arrow keys.") + "</p>"; }); };
AFTER.g_hearts = function () {
  if (V.st !== "play") return;
  var cv = el("cv"), ctx = cv.getContext("2d"), W = 300, H = 300, raf = 0, last = 0, g = V.g, i, keys = {}, run = true;
  if (!g) {
    g = V.g = {x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, got: 0, t: 0, h: [], f: []};
    for (i = 0; i < 12; i++) g.h.push({x: 0.08 + Math.random() * 0.84, y: 0.1 + Math.random() * 0.8, on: true});
    for (i = 0; i < 9; i++) g.f.push({x: Math.random(), y: Math.random(), e: ["🌷", "🌼", "🌻"][i % 3]});
  }
  function resize() { var d = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth || 300; H = cv.clientHeight || 300; cv.width = Math.round(W * d); cv.height = Math.round(H * d); ctx.setTransform(d, 0, 0, d, 0, 0); }
  function pt(e) { var r = cv.getBoundingClientRect(); g.tx = Math.max(0.04, Math.min(0.96, (e.clientX - r.left) / r.width)); g.ty = Math.max(0.05, Math.min(0.95, (e.clientY - r.top) / r.height)); }
  var down = false;
  cv.addEventListener("pointerdown", function (e) { down = true; pt(e); e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { if (down) pt(e); });
  cv.addEventListener("pointerup", function () { down = false; });
  cv.addEventListener("pointercancel", function () { down = false; });
  V.kd = function (e) { if (e.key && e.key.indexOf("Arrow") === 0) { keys[e.key] = 1; e.preventDefault(); } };
  V.ku = function (e) { if (e.key) delete keys[e.key]; };
  function frame(ts) {
    if (!run) return;
    var dt = Math.min(0.05, (ts - last) / 1000 || 0), kx, ky, dx, dy, d, sp, k, h, grd;
    last = ts;
    kx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0); ky = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
    if (kx || ky) { g.tx = Math.max(0.04, Math.min(0.96, g.x + kx * 0.15)); g.ty = Math.max(0.05, Math.min(0.95, g.y + ky * 0.15)); }
    dx = (g.tx - g.x) * W; dy = (g.ty - g.y) * H; d = Math.sqrt(dx * dx + dy * dy); sp = 250 * dt;
    if (d > 2) { if (d < sp) sp = d; g.x += dx / d * sp / W; g.y += dy / d * sp / H; }
    g.t += dt;
    for (k = 0; k < g.h.length; k++) { h = g.h[k]; if (h.on) { dx = (h.x - g.x) * W; dy = (h.y - g.y) * H; if (dx * dx + dy * dy < 900) { h.on = false; g.got++; sfx("pick"); el("hc").textContent = g.got; } } }
    el("ht").textContent = Math.floor(g.t);
    grd = ctx.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, "#c6f3aa"); grd.addColorStop(1, "#8ed973");
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "22px sans-serif"; for (k = 0; k < g.f.length; k++) ctx.fillText(g.f[k].e, g.f[k].x * W, g.f[k].y * H);
    ctx.font = "28px sans-serif"; for (k = 0; k < g.h.length; k++) if (g.h[k].on) ctx.fillText("❤️", g.h[k].x * W, g.h[k].y * H + (ST.anim ? Math.sin(g.t * 3 + k) * 4 : 0));
    ctx.font = "40px sans-serif"; ctx.fillText("🐰", g.x * W, g.y * H);
    if (g.got >= 12) { ST.hearts += 12; gEnd(tr("Ти зібрав усі 12 сердечок за |You collected all 12 hearts in ") + Math.floor(g.t) + tr(" с. Любові вистачить на всіх!| s. There is enough love for everyone!"), "hearts", Math.floor(g.t), true); return; }
    raf = window.requestAnimationFrame(frame);
  }
  resize(); window.addEventListener("resize", resize);
  el("hc").textContent = g.got;
  V.stop = function () { run = false; window.cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  raf = window.requestAnimationFrame(frame);
};

/* 2. memory */
VIEWS.g_memory = function () {
  return gWrap("memory", function () {
    var i, c, s, ids;
    if (!V.cards) { ids = shuffle(range(MEMO.length)).slice(0, 6); V.cards = []; for (i = 0; i < 6; i++) { V.cards.push({m: ids[i]}); V.cards.push({m: ids[i]}); } V.cards = shuffle(V.cards); V.sel = []; V.moves = 0; }
    s = '<div class="hud"><span>🃏 ' + tr("Ходів: |Moves: ") + V.moves + '</span></div><div class="mem">';
    for (i = 0; i < V.cards.length; i++) { c = V.cards[i]; s += '<button class="' + (c.ok ? "ok" : (c.open ? "op" : "")) + '" data-a="mem:' + i + '" aria-label="' + (i + 1) + '">' + (c.ok || c.open ? MEMO[c.m][0] + "<small>" + tr(MEMO[c.m][1]) + "</small>" : "✨") + "</button>"; }
    return s + "</div>";
  });
};
ACT.mem = function (i) {
  var c = V.cards[+i], a, b;
  if (V.lock || c.open || c.ok) return;
  c.open = true; V.sel.push(c); sfx("tap");
  if (V.sel.length === 2) {
    V.moves++; a = V.sel[0]; b = V.sel[1]; V.sel = [];
    if (a.m === b.m) { a.ok = b.ok = true; sfx("ok"); for (i = 0; i < V.cards.length; i++) if (!V.cards[i].ok) { draw(); return; } gEnd(tr("Усі пари знайдено! Ходів: |All pairs found! Moves: ") + V.moves, "memory", V.moves, true); return; }
    V.lock = true;
    V.tm = setTimeout(function () { a.open = b.open = false; V.lock = false; V.tm = null; draw(); }, 950);
  }
  draw();
};

/* 3. maze */
function mazeGen(n, seed) {
  var S = 2 * n + 1, g = [], r = rng(seed), x, y, st = [[1, 1]], c, ds, k, j, t, nx, ny, found;
  for (y = 0; y < S; y++) { g[y] = []; for (x = 0; x < S; x++) g[y][x] = 1; }
  g[1][1] = 0;
  while (st.length) {
    c = st[st.length - 1]; ds = [[2, 0], [-2, 0], [0, 2], [0, -2]];
    for (k = 3; k > 0; k--) { j = Math.floor(r() * (k + 1)); t = ds[k]; ds[k] = ds[j]; ds[j] = t; }
    found = false;
    for (k = 0; k < 4; k++) { nx = c[0] + ds[k][0]; ny = c[1] + ds[k][1]; if (nx > 0 && ny > 0 && nx < S - 1 && ny < S - 1 && g[ny][nx] === 1) { g[c[1] + ds[k][1] / 2][c[0] + ds[k][0] / 2] = 0; g[ny][nx] = 0; st.push([nx, ny]); found = true; break; } }
    if (!found) st.pop();
  }
  return {g: g, S: S, px: 1, py: 1, gx: S - 2, gy: S - 2};
}
function mazeCells() {
  var m = V.mz, s = "", x, y;
  for (y = 0; y < m.S; y++) for (x = 0; x < m.S; x++) s += (m.g[y][x] ? '<div class="w"></div>' : "<div>" + (x === m.px && y === m.py ? "🧒" : (x === m.gx && y === m.gy ? "🏡" : "")) + "</div>");
  return s;
}
VIEWS.g_maze = function () {
  return gWrap("maze", function () {
    if (V.lv == null) { V.lv = 0; V.steps = 0; }
    if (!V.mz) V.mz = mazeGen(3 + V.lv, Math.floor(Math.random() * 1e9) + 1);
    return '<div class="hud"><span>🏡 ' + tr("Рівень|Level") + " " + (V.lv + 1) + '/3</span><span>👣 <b id="ms">' + V.steps + '</b></span></div><div class="mz" id="mz" style="grid-template-columns:repeat(' + V.mz.S + ',1fr)">' + mazeCells() + '</div><div class="dpad"><span></span><button data-f="1" data-a="mv:0:-1" aria-label="up">▲</button><span></span><button data-f="1" data-a="mv:-1:0" aria-label="left">◀</button><button data-f="1" data-a="mv:0:1" aria-label="down">▼</button><button data-f="1" data-a="mv:1:0" aria-label="right">▶</button></div>';
  });
};
AFTER.g_maze = function () {
  if (V.st !== "play") return;
  var mz = el("mz"), x0 = null, y0 = 0;
  V.kd = function (e) { var d = {ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0]}[e.key]; if (d) { e.preventDefault(); ACT.mv(d[0], d[1]); } };
  mz.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  mz.addEventListener("touchend", function (e) {
    if (x0 == null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) ACT.mv(dx > 0 ? 1 : -1, 0); else ACT.mv(0, dy > 0 ? 1 : -1);
  }, {passive: true});
};
ACT.mv = function (dx, dy) {
  var m = V.mz, nx, ny;
  if (!m || V.st !== "play") return;
  nx = m.px + (+dx); ny = m.py + (+dy);
  if (m.g[ny][nx]) return;
  m.px = nx; m.py = ny; V.steps++; sfx("tap");
  if (nx === m.gx && ny === m.gy) {
    if (V.lv < 2) { V.lv++; V.mz = null; sfx("ok"); toast(tr("Рівень пройдено! Далі — складніше.|Level complete! The next one is trickier.")); draw(); }
    else gEnd(tr("Ти вдома! Батько радо зустрічає. Кроків: |You are home! The father welcomes you with joy. Steps: ") + V.steps, "maze", V.steps, true);
    return;
  }
  el("mz").innerHTML = mazeCells(); el("ms").textContent = V.steps;
};

/* 4. garden */
VIEWS.g_garden = function () {
  return gWrap("garden", function () {
    var fl = ["🌻", "🌷", "🌼", "🌹", "🌸", "🌺"], lab = ["Посади 🌰|Plant 🌰", "Полий 💧|Water 💧", "Добре завдання 💛|Kind task 💛", "Цвіте!|In bloom!"], em, s, i, n = 0;
    if (!V.pl) V.pl = [0, 0, 0, 0, 0, 0];
    for (i = 0; i < 6; i++) if (V.pl[i] === 3) n++;
    s = '<div class="hud"><span>🌻 ' + n + '/6</span></div><div class="plots">';
    for (i = 0; i < 6; i++) { em = ["&nbsp;", "🌱", "🌿", fl[i]][V.pl[i]]; s += '<button class="' + (V.pl[i] === 3 ? "bl" : "") + '" data-a="plot:' + i + '">' + em + "<small>" + tr(lab[V.pl[i]]) + "</small></button>"; }
    return s + "</div>" + say("bunny", tr("Торкайся грядок: спершу посади, потім полий, а тоді — добре завдання!|Tap the beds: first plant, then water, and then — a kind task!"));
  });
};
ACT.plot = function (i) {
  i = +i;
  if (V.pl[i] === 3) return;
  if (V.pl[i] < 2) { V.pl[i]++; sfx("pick"); draw(); return; }
  modal('<div class="center" style="font-size:46px">💛</div><h3 class="center">' + tr("Добре завдання|Kind task") + '</h3><p class="center">' + tr(KIND[i]) + "</p>" + B(tr("Я це зроблю! 💛|I will do it! 💛"), "kind:" + i, "b2") + B(tr("Пізніше|Later"), "close", "b5"));
};
ACT.kind = function (i) {
  var k; closeModal(); V.pl[+i] = 3; ST.flowers++; save(); sfx("ok");
  for (k = 0; k < 6; k++) if (V.pl[k] !== 3) { draw(); return; }
  gEnd(tr("Твій сад розквітнув! Шість квітів і шість добрих справ.|Your garden is in bloom! Six flowers and six kind deeds."), "garden", 1, false);
};

/* 5. journey */
VIEWS.g_journey = function () {
  return gWrap("journey", function () {
    var s, i, J, n = 0;
    if (!V.vis) V.vis = {};
    for (i = 0; i < JOURNEY.length; i++) if (V.vis[i]) n++;
    if (V.loc == null) {
      s = '<div class="hud"><span>🌍 ' + n + "/" + JOURNEY.length + '</span></div><div class="map"><svg viewBox="0 0 100 110" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="110" fill="#f6e7b8"/><path d="M0 0 H26 Q18 30 22 55 Q14 85 20 110 H0Z" fill="#8fd3ff"/><ellipse cx="62" cy="14" rx="9" ry="12" fill="#8fd3ff"/><path d="M63 25 Q70 45 66 62 Q64 80 68 94" stroke="#8fd3ff" stroke-width="2.4" fill="none"/><ellipse cx="68" cy="100" rx="5" ry="8" fill="#8fd3ff"/><path d="M66 86 L30 31 L64 11 L76 50 L34 67" stroke="#e8752a" stroke-width="1" stroke-dasharray="2 2.5" fill="none"/><circle cx="34" cy="70" r="7" fill="#cfe9a8"/><circle cx="48" cy="48" r="6" fill="#cfe9a8"/><circle cx="84" cy="36" r="8" fill="#ecd9a0"/></svg>';
      for (i = 0; i < JOURNEY.length; i++) { J = JOURNEY[i]; s += '<button class="pin' + (V.vis[i] ? " v" : "") + '" style="left:' + J.x + "%;top:" + (J.y / 1.1) + '%" data-a="pin:' + i + '"><b>' + (V.vis[i] ? "✅" : J.em) + "</b>" + tr(J.n) + "</button>"; }
      return s + "</div>" + say("bird", n === JOURNEY.length ? tr("Ти відвідав усі місця!|You have visited every place!") : tr("Торкнися місця на мапі — і я розповім його історію.|Tap a place on the map and I will tell its story."));
    }
    J = JOURNEY[V.loc];
    s = '<div class="card"><div class="center" style="font-size:48px">' + J.em + '</div><h2 class="center">' + tr(J.n) + "</h2><p>" + tr(J.s) + '</p></div><div class="card"><div class="qtext">' + tr(J.q) + "</div>";
    for (i = 0; i < J.o.length; i++) s += '<button class="opt' + (V.jbad[i] ? " bad" : "") + (V.jok && i === J.a ? " good" : "") + '" data-a="jans:' + i + '">' + tr(J.o[i]) + "</button>";
    s += "</div>";
    if (V.jok) s += '<div class="starpop">⭐</div>' + B(tr("До мапи ➜|Back to the map ➜"), "jback", "b2");
    else if (V.jhint) s += say("bear", tr("Нічого страшного! Перечитай історію ще раз — відповідь там.|No worries! Read the story once more — the answer is there."));
    return s;
  });
};
ACT.pin = function (i) { V.loc = +i; V.jok = !!V.vis[+i]; V.jbad = {}; V.jhint = false; sfx("tap"); draw(); window.scrollTo(0, 0); };
ACT.jans = function (i) { if (V.jok) return; if (+i === JOURNEY[V.loc].a) { V.jok = true; V.vis[V.loc] = 1; ST.stars++; save(); sfx("ok"); } else { V.jbad[+i] = 1; V.jhint = true; sfx("no"); } draw(); };
ACT.jback = function () {
  var i; V.loc = null;
  for (i = 0; i < JOURNEY.length; i++) if (!V.vis[i]) { draw(); window.scrollTo(0, 0); return; }
  gEnd(tr("Подорож завершено! Ти пройшов шляхом Ісуса від Вифлеєма до Єрусалима.|Journey complete! You followed the path of Jesus from Bethlehem to Jerusalem."), "journey", 1, false);
};

/* 6. rainbow */
VIEWS.g_rainbow = function () {
  return gWrap("rainbow", function () {
    var s, i, t;
    if (!V.rq) { V.rq = shuffle(range(RAIN.length)); V.rk = 0; V.lit = {}; }
    t = V.rq[V.rk];
    s = '<svg class="rbw" viewBox="0 0 200 104" xmlns="http://www.w3.org/2000/svg">';
    for (i = 0; i < 7; i++) s += '<path d="M' + (8 + i * 10) + " 102 A" + (92 - i * 10) + " " + (92 - i * 10) + " 0 0 1 " + (192 - i * 10) + ' 102" fill="none" stroke="' + (V.lit[i] ? RAIN[i][0] : "#cfd8e3") + '" stroke-width="9"/>';
    s += '</svg><div class="card center"><span class="chip">' + (V.rk + 1) + '/7</span><div class="qtext">' + tr(RAIN[t][2]) + "</div></div>";
    for (i = 0; i < 7; i++) s += '<button class="band' + (V.lit[i] ? " lit" : "") + '" style="background:' + RAIN[i][0] + '" data-a="rb:' + i + '">' + (V.lit[i] ? "✓ " : "") + tr(RAIN[i][1]) + "</button>";
    if (V.rbad) s += say("bear", tr("Майже! Прочитай підказку ще раз і спробуй інший колір.|Almost! Read the clue again and try another colour."));
    return s;
  });
};
ACT.rb = function (i) {
  i = +i; if (V.lit[i]) return;
  if (i === V.rq[V.rk]) { V.lit[i] = 1; V.rk++; V.rbad = false; if (V.rk >= 7) { gEnd(tr("Уся веселка сяє! Любов, радість, світло, життя, мир, довіра й благодать — це Божі подарунки.|The whole rainbow is shining! Love, joy, light, life, peace, trust and grace are God’s gifts."), "rainbow", 1, false); return; } sfx("ok"); }
  else { V.rbad = true; sfx("no"); }
  draw();
};

/* ---------- init ---------- */
function init() {
  var nav = el("nav"), i, b;
  for (i = 0; i < NAVS.length; i++) {
    b = document.createElement("button"); b.id = "n-" + NAVS[i][0]; nav.appendChild(b);
    (function (name) { hook(b, function () { sfx("tap"); go(name); }); })(NAVS[i][0]);
  }
  hook(el("bBack"), function () { sfx("tap"); goBack(); });
  hook(el("lUk"), function () { ACT.lang("uk"); });
  hook(el("lEn"), function () { ACT.lang("en"); });
  hook(el("bMus"), function () { ACT.tog("music"); });
  hook(el("modal"), function (e) { if (e.target === el("modal")) closeModal(); });
  document.addEventListener("pointerdown", unlock, true);
  document.addEventListener("touchstart", unlock, true);
  document.addEventListener("keydown", unlock, true);
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (V.kd) V.kd(e);
    if (V.n === "reader") { if (e.key === "ArrowRight") ACT.pg(1); else if (e.key === "ArrowLeft") ACT.pg(-1); }
    if (e.key === "Escape") { if (el("modal").className === "on") closeModal(); else goBack(); }
  });
  document.addEventListener("keyup", function (e) { if (V.ku) V.ku(e); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { document.body.classList.add("paused"); stopSpeak(); if (AC && AC.state === "running") { try { AC.suspend(); } catch (e) {} } }
    else { document.body.classList.remove("paused"); if (AC) { try { AC.resume(); } catch (e2) {} } }
  });
  draw();
}
init();
